<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>④ 英文界面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width:1360px;height:500px;box-sizing:border-box;padding:32px 40px;background:#fbfaf7;color:#2b2925;font-family:Inter,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;display:flex;flex-direction:column;gap:16px">
  <h3 style="margin:0;font-size:18px;font-weight:600">④ 英文界面（修后）：提示文案随语言走</h3>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px">
    <figure style="margin:0;display:flex;flex-direction:column;gap:8px">
      <figcaption style="font-size:13px;color:#2f6b3a;font-weight:600">点空白后收起</figcaption>
      <img src="/_blob/3195e0f741dec70b39c6afe1cf975b3b" alt="英文：点画布空白后视图浮层收起" style="width:100%;height:auto;border:1px solid #e6e2da;border-radius:8px;display:block">
    </figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:8px">
      <figcaption style="font-size:13px;color:#2f6b3a;font-weight:600">画布格式条 · Italic</figcaption>
      <img src="/_blob/c76655c0a99c79d51b08cd2dc8baab74" alt="英文：画布格式条悬停出 Italic 提示" style="width:100%;height:auto;border:1px solid #e6e2da;border-radius:8px;display:block">
    </figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:8px">
      <figcaption style="font-size:13px;color:#2f6b3a;font-weight:600">创作区 · Inline code</figcaption>
      <img src="/_blob/ab95188512ec95b67648c121b7668695" alt="英文：创作区工具栏悬停出行内代码提示" style="width:100%;height:auto;border:1px solid #e6e2da;border-radius:8px;display:block">
    </figure>
  </div>
  <p style="margin:0;font-size:13px;line-height:1.6;color:#5f5b54">窄窗、Windows 没跑，PR 里记作未验证。</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":500}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>

body{margin:0}
.light{--nomi-bg:oklch(.985 .003 90);--nomi-paper:oklch(1 0 0);--nomi-ink:oklch(.22 .01 80);--nomi-ink80:oklch(.32 .01 80);--nomi-ink60:oklch(.5 .01 80);--nomi-ink40:oklch(.68 .01 80);--nomi-ink10:oklch(.94 .003 80);--nomi-ink05:oklch(.97 .003 80);--nomi-line:oklch(.91 .004 80);--nomi-accent:oklch(.55 .13 250);--nomi-accent-soft:color-mix(in srgb,var(--nomi-accent) 12%,var(--nomi-paper));--nomi-warning-ink:oklch(.45 .085 72);--nomi-warning-soft:oklch(.968 .024 72);--nomi-bubble:oklch(.22 .01 80);--nomi-bubble-ink:oklch(.985 .003 90);--nomi-bubble-chip:oklch(.32 .01 80)}

.root *{box-sizing:border-box}
.lbl{font-size:12px;color:var(--nomi-ink60);margin:0 0 8px 2px}
.lbl b{color:var(--nomi-ink);font-weight:600;margin-right:6px}
.shot{display:block;border:1px solid var(--nomi-line);border-radius:12px}
.comp{width:390px;border:1px solid var(--nomi-line);border-radius:12px;background:var(--nomi-paper);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cc{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 4px;border:1px solid var(--nomi-line);border-radius:var(--nomi-radius-sm);background:var(--nomi-paper);font-size:12px;color:var(--nomi-ink80);white-space:nowrap}
.cc .v{color:var(--nomi-ink60)}
.cc .x{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;padding:0;border:0;border-radius:4px;background:transparent;color:var(--nomi-ink40)}
.cc.hover{background:var(--nomi-ink05)}
.cc.hover .x{color:var(--nomi-ink80)}
.cc.gone{border-style:dashed;color:var(--nomi-warning-ink);background:var(--nomi-warning-soft);border-color:transparent}
.cc svg.t{display:block;border-radius:3px;flex:none}
.txt{font-size:13px;line-height:20px;color:var(--nomi-ink)}
.st{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.st .k{font-size:12px;color:var(--nomi-ink60)}
.ub{padding:8px 12px;border-radius:12px;background:var(--nomi-bubble);color:var(--nomi-bubble-ink);display:flex;flex-direction:column;gap:6px;max-width:300px}
.ub .bc{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 3px;border-radius:var(--nomi-radius-sm);background:var(--nomi-bubble-chip);font-size:12px}
.ub svg{display:block;border-radius:3px}
</style>

        </div>

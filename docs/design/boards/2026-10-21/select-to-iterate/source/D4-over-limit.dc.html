<style>
body{margin:0}
.light{--nomi-bg:oklch(.985 .003 90);--nomi-paper:oklch(1 0 0);--nomi-ink:oklch(.22 .01 80);--nomi-ink80:oklch(.32 .01 80);--nomi-ink60:oklch(.5 .01 80);--nomi-ink40:oklch(.68 .01 80);--nomi-ink10:oklch(.94 .003 80);--nomi-ink05:oklch(.97 .003 80);--nomi-line:oklch(.91 .004 80);--nomi-warning-ink:oklch(.45 .085 72);--nomi-warning-soft:oklch(.968 .024 72)}
.root{--nomi-radius-sm:6px;--nomi-radius:10px;box-sizing:border-box;background-color:var(--nomi-bg);color:var(--nomi-ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:13px;line-height:1.5}
.root *{box-sizing:border-box}
.lbl{font-size:12px;color:var(--nomi-ink60);margin:0 0 8px 2px}
.lbl b{color:var(--nomi-ink);font-weight:600;margin-right:6px}
.shot{display:block;border:1px solid var(--nomi-line);border-radius:12px}
.sp{flex:1;min-width:0}
button{font-family:inherit;cursor:default}
.comp{width:390px;border:1px solid var(--nomi-line);border-radius:12px;background:var(--nomi-paper);padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cc{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px;border:1px solid var(--nomi-line);border-radius:var(--nomi-radius-sm);background:var(--nomi-paper);font-size:12px;color:var(--nomi-ink80);white-space:nowrap}
.cc.more{padding:0 8px;background:var(--nomi-ink05);border-color:transparent}
.cc svg.t{display:block;border-radius:3px;flex:none}
.warn{display:flex;align-items:center;gap:6px;min-height:28px;padding:0 4px 0 8px;border-radius:var(--nomi-radius-sm);background:var(--nomi-warning-soft);color:var(--nomi-warning-ink);font-size:12px}
.warn button{margin-left:auto;height:24px;padding:0 8px;border:0;border-radius:999px;background:transparent;color:var(--nomi-warning-ink);font-size:12px;font-weight:600}
.txt{font-size:13px;line-height:20px;color:var(--nomi-ink)}
.bar{display:flex;align-items:center;gap:2px}
.bar .t{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border:0;border-radius:999px;background:transparent;color:var(--nomi-ink80);font-size:13px}
.vsep{flex:none;width:1px;height:16px;background:var(--nomi-line);margin:0 2px}
.send{flex:none;width:30px;height:30px;padding:0;border:0;border-radius:999px;background:var(--nomi-ink10);color:var(--nomi-ink40);display:flex;align-items:center;justify-content:center}
</style>
</helmet>

        <button class="cc more" type="button">还有 12 个</button>

      <div class="warn">已选 15 个 · 一次最多改 12 个<button type="button">只留前 12 个</button></div>

      </div>
    </div>
  </div>
</div>

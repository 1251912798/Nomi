<style>
body{margin:0}
.light{--nomi-bg:oklch(.985 .003 90);--nomi-paper:oklch(1 0 0);--nomi-ink:oklch(.22 .01 80);--nomi-ink80:oklch(.32 .01 80);--nomi-ink60:oklch(.5 .01 80);--nomi-ink40:oklch(.68 .01 80);--nomi-ink10:oklch(.94 .003 80);--nomi-ink05:oklch(.97 .003 80);--nomi-line:oklch(.91 .004 80);--nomi-accent:oklch(.55 .13 250);--nomi-accent-soft:color-mix(in srgb,var(--nomi-accent) 12%,var(--nomi-paper))}
.root{--nomi-radius:10px;box-sizing:border-box;background-color:var(--nomi-bg);color:var(--nomi-ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:13px;line-height:1.5}
.root *{box-sizing:border-box}
.dots{background-image:radial-gradient(var(--nomi-ink10) 1px,transparent 1px);background-size:18px 18px}
.lbl{font-size:12px;color:var(--nomi-ink60);margin:0 0 8px 2px}
.lbl b{color:var(--nomi-ink);font-weight:600;margin-right:6px}
.shot{display:block;border:1px solid var(--nomi-line);border-radius:12px}
.n{position:absolute}
.n .tt{font-size:12px;color:var(--nomi-ink60);margin:0 0 4px 2px;white-space:nowrap}
.n .card{position:relative;border-radius:8px;overflow:visible}
.n .card svg.im{display:block;border-radius:8px}
.n.sel .card{outline:1.5px solid var(--nomi-ink80);outline-offset:2px;border-radius:8px}
.hd{position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--nomi-paper);border:1.5px solid var(--nomi-ink40)}
.draft{width:240px;height:135px;border:1.5px dashed var(--nomi-accent);border-radius:8px;background:var(--nomi-paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--nomi-ink60);font-size:12px}
.draft .t{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:var(--nomi-accent-soft);color:var(--nomi-accent);font-size:12px;font-weight:500}
</style>
</helmet>

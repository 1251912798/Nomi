:root {
  --nomi-media-ink: oklch(1 0 0);
  --nomi-bg: oklch(0.985 0.003 90);
  --nomi-paper: oklch(1 0 0);
  --nomi-ink: oklch(0.22 0.01 80);
  --nomi-ink-80: oklch(0.32 0.01 80);
  --nomi-ink-60: oklch(0.50 0.01 80);
  --nomi-ink-40: oklch(0.68 0.01 80);
  --nomi-ink-30: oklch(0.78 0.01 80);
  --nomi-ink-20: oklch(0.88 0.005 80);
  --nomi-ink-10: oklch(0.94 0.003 80);
  --nomi-ink-05: oklch(0.97 0.003 80);
  --nomi-chrome: oklch(0.97 0.003 80);
  --nomi-line: oklch(0.91 0.004 80);
  --nomi-line-soft: oklch(0.95 0.003 80);
  --nomi-accent: oklch(0.55 0.13 250);
  /* ⚠️ 必须 in srgb，别改回 in oklch —— oklch 会对色相走最短弧插值，把 accent(h250) 拽向 paper 被钉死的
     色相（浅 h=0 → 粉 h≈347 / 暗 h=80 → 橄榄绿 h≈124）。完整原委见 tailwind.config.ts 同名 token（运行时真源）。 */
  --nomi-accent-soft: color-mix(in srgb, var(--nomi-accent) 12%, var(--nomi-paper));
  /* 根层语义状态色（① 层，四语义 × 四档）。2026-09-07 用户拍板候选 C（danger 提到 0.13），
     同日修掉一处错规格：soft/edge 不是 base 的 alpha，而是色阶上独立的一档
     （alpha 摊薄 L0.55 的 base 只到 L≈0.92，浅底会发灰发土）。浅色 soft 贴 sRGB 天花板取
     L 0.955–0.968，edge 深一档 L 0.895–0.905。info 收成 accent 的别名（原独立值与 accent
     同色相同亮度、只差 ΔC 0.04，是并行版）。完整推导与对比度实测见 tailwind.config.ts 同名 token（运行时真源）。 */
  --nomi-danger: oklch(0.55 0.13 25);
  --nomi-danger-ink: oklch(0.45 0.13 25);
  --nomi-danger-soft: oklch(0.955 0.021 25);
  --nomi-danger-edge: oklch(0.895 0.052 25);
  --nomi-warning: oklch(0.55 0.085 72);
  --nomi-warning-ink: oklch(0.45 0.085 72);
  --nomi-warning-soft: oklch(0.968 0.024 72);
  --nomi-warning-edge: oklch(0.905 0.07 72);
  --nomi-success: oklch(0.55 0.09 145);
  --nomi-success-ink: oklch(0.45 0.09 145);
  --nomi-success-soft: oklch(0.962 0.033 145);
  --nomi-success-edge: oklch(0.905 0.07 145);
  --nomi-info: var(--nomi-accent);
  --nomi-info-ink: oklch(0.45 0.13 250);
  --nomi-info-soft: oklch(0.957 0.021 250);
  --nomi-info-edge: oklch(0.9 0.048 250);
  --nomi-track-text: var(--nomi-accent);
  --nomi-group-neutral: oklch(0.68 0.01 80);
  --nomi-group-ocean: oklch(0.55 0.13 250);
  --nomi-group-teal: oklch(0.58 0.12 174);
  --nomi-group-amber: oklch(0.68 0.14 75);
  --nomi-group-coral: oklch(0.59 0.14 25);
  --nomi-group-violet: oklch(0.57 0.13 300);
  --nomi-group-rose: oklch(0.60 0.13 350);
  --nomi-group-neutral-soft: oklch(0.955 0.004 85);
  --nomi-group-ocean-soft: oklch(0.955 0.022 250);
  --nomi-group-teal-soft: oklch(0.955 0.024 174);
  --nomi-group-amber-soft: oklch(0.958 0.04 75);
  --nomi-group-coral-soft: oklch(0.955 0.04 28);
  --nomi-group-violet-soft: oklch(0.955 0.03 300);
  --nomi-group-rose-soft: oklch(0.955 0.03 330);
  --nomi-track-image: oklch(0.7 0.13 200);
  --nomi-track-video: oklch(0.65 0.13 150);
  /* 3D 轴向语义色(X/Y/Z) —— 无对应 UI token,沉淀成 token */
  --nomi-axis-x: #ef4444;
  --nomi-axis-y: #16a34a;
  --nomi-axis-z: #3b82f6;
  /* 时间轴吸附反馈（暖橙，与 accent 蓝互补、对比最大；仅拖动中临时出现） */
  --nomi-snap: oklch(0.72 0.18 30);
  --nomi-snap-tag: oklch(0.45 0.18 30);
  /* 品牌 mark 底色（§3.9 深底+白笔画）。暗色提亮见下方 dark 块。 */
  --nomi-logo-ground: oklch(0.22 0.01 80);
  /* 媒体浮层（图片之上的 scrim / 徽章 / 渐变遮罩）——深色取 ink 同色相，集中此处，组件只引 token，
     不在 JSX 直写 oklch（§2.1）。scrim=模态背景压暗；overlay-chip=图上小标；media-veil=底部标题渐变。 */
  --nomi-scrim: oklch(0.2 0.01 80 / 0.42);
  /* 图上徽章/标题遮罩承载白字，压在任意亮度的媒体上（暗色卡底常是白衬衫等亮区）——
     opacity 提高到能稳定托住白字为止，光暗都验（2026-09-01 用户反馈「徽标黑底黑字/标题融背景」）。 */
  --nomi-overlay-chip: oklch(0.18 0.01 80 / 0.64);
  --nomi-overlay-chip-strong: oklch(0.16 0.01 80 / 0.82);
  --nomi-media-veil: oklch(0.12 0.01 80 / 0.74);

  --nomi-radius-sm: 6px;
  --nomi-radius: 10px;
  --nomi-radius-lg: 16px;

/* 深色主题（暖灰 oklch）。⚠️ 运行时真源是 tailwind.config.ts 的 addBase（编译进 tailwind.generated.css）；
   本文件未被任何 import = 参考镜像 + 喂 check-dangling-tokens。改值两处都要同步（§0.5）。
   3D 轴色(--nomi-axis-*)主题无关，明暗同色，故此处不重定义。 */
:root[data-mantine-color-scheme="dark"] {
  color-scheme: dark;
  --nomi-bg: oklch(0.18 0.006 80);
  --nomi-paper: oklch(0.235 0.007 80);
  --nomi-ink: oklch(0.93 0.006 85);
  --nomi-ink-80: oklch(0.84 0.006 85);
  --nomi-ink-60: oklch(0.70 0.006 85);
  --nomi-ink-40: oklch(0.62 0.006 85);
  --nomi-ink-30: oklch(0.50 0.006 85);
  --nomi-ink-20: oklch(0.42 0.006 85);
  --nomi-ink-10: oklch(0.34 0.006 85);
  --nomi-ink-05: oklch(0.30 0.006 85);
  --nomi-chrome: oklch(0.155 0.006 80);
  --nomi-line: oklch(0.36 0.007 80);
  --nomi-line-soft: oklch(0.31 0.007 80);
  --nomi-accent: oklch(0.70 0.13 250);
  /* in srgb 同上：暗色 paper h=80，走 oklch 会把选中态混成橄榄绿。 */
  --nomi-accent-soft: color-mix(in srgb, var(--nomi-accent) 26%, var(--nomi-paper));
  /* 状态色暗色档：base 亮度平台对齐 accent 的 0.70，-ink 字色提到 0.82。
     soft/edge 必须另写一档（浅色那档是 L≈0.96 的近白底，拿到暗色上是刺眼白块）：
     soft L≈0.295–0.30 / C≤0.048，edge L≈0.395–0.40。
     info 的 base 不在此重定义——它是 var(--nomi-accent) 的别名，accent 在本块已翻暗。 */
  --nomi-danger: oklch(0.72 0.13 25);
  --nomi-danger-ink: oklch(0.82 0.13 25);
  --nomi-danger-soft: oklch(0.3 0.048 25);
  --nomi-danger-edge: oklch(0.4 0.07 25);
  --nomi-warning: oklch(0.72 0.085 72);
  --nomi-warning-ink: oklch(0.82 0.085 72);
  --nomi-warning-soft: oklch(0.295 0.04 72);
  --nomi-warning-edge: oklch(0.395 0.058 72);
  --nomi-success: oklch(0.72 0.09 145);
  --nomi-success-ink: oklch(0.82 0.09 145);
  --nomi-success-soft: oklch(0.295 0.042 145);
  --nomi-success-edge: oklch(0.395 0.06 145);
  --nomi-info-ink: oklch(0.82 0.13 250);
  --nomi-info-soft: oklch(0.295 0.045 250);
  --nomi-info-edge: oklch(0.395 0.065 250);
  --nomi-track-text: oklch(0.75 0.15 305);
  --nomi-group-neutral: oklch(0.62 0.006 85);
  --nomi-group-ocean: oklch(0.70 0.13 250);
  --nomi-group-teal: oklch(0.72 0.12 174);
  --nomi-group-amber: oklch(0.78 0.14 75);
  --nomi-group-coral: oklch(0.72 0.14 25);
  --nomi-group-violet: oklch(0.70 0.13 300);
  --nomi-group-rose: oklch(0.73 0.13 350);
  --nomi-group-neutral-soft: oklch(0.30 0.005 85);
  --nomi-group-ocean-soft: oklch(0.30 0.04 250);
  --nomi-group-teal-soft: oklch(0.30 0.035 174);
  --nomi-group-amber-soft: oklch(0.32 0.05 75);
  --nomi-group-coral-soft: oklch(0.31 0.055 28);
  --nomi-group-violet-soft: oklch(0.30 0.04 300);
  --nomi-group-rose-soft: oklch(0.31 0.045 330);
  --nomi-track-image: oklch(0.72 0.13 200);
  --nomi-track-video: oklch(0.70 0.13 150);
  --nomi-snap: oklch(0.78 0.18 30);
  --nomi-snap-tag: oklch(0.62 0.18 30);
  --nomi-logo-ground: oklch(0.30 0.01 80);
  --nomi-scrim: oklch(0.08 0.004 80 / 0.58);
  /* 媒体浮层在暗色主题下同样承载白字，且卡底媒体可能是亮区——opacity 提到托得住白字。 */
  --nomi-overlay-chip: oklch(0.06 0.004 80 / 0.78);
  --nomi-overlay-chip-strong: oklch(0.05 0.004 80 / 0.88);
  --nomi-media-veil: oklch(0.05 0.004 80 / 0.86);
  --nomi-shadow-sm: 0 1px 2px oklch(0 0 0 / 0.32), 0 1px 1px oklch(0 0 0 / 0.22);
  --nomi-shadow-md: 0 2px 5px oklch(0 0 0 / 0.30), 0 14px 34px oklch(0 0 0 / 0.32);
  --nomi-shadow-lg: 0 4px 10px oklch(0 0 0 / 0.30), 0 24px 64px oklch(0 0 0 / 0.40);
}

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>付费卡 · 部件</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{rootW}}px; height: {{rootH}}; background: {{rootBg}}; position: relative; box-sizing: border-box; font-family: Inter, 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif; color: {{c.ink}}; -webkit-font-smoothing: antialiased;">
  <div style="position: relative; height: {{shellH}}; border-radius: {{shellRadius}}; border: {{shellBorder}}; background: {{shellBg}}; box-shadow: {{shellShadow}}; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box;">
    <sc-if value="{{panel}}" hint-placeholder-val="{{ true }}">
      <div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box;">
        <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 5px; background: {{c.ink}}; color: {{c.paper}}; font-size: 11px; font-weight: 700; display: grid; place-items: center;">N</span>
        <span style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em;">Nomi</span>
        <span style="height: 22px; padding: 0 6px 0 8px; border: 1px solid {{c.line}}; border-radius: 999px; font-size: 11px; color: {{c.ink80}}; display: inline-flex; align-items: center; gap: 2px; box-sizing: border-box;">{{t.used}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
        <span style="flex: 1;"></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{c.ink60}};"><path d="M12 8v4l2 2"></path><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"></path></svg>
        <span aria-hidden="true" style="height: 26px; padding: 0 3px; border-radius: 8px; background: {{c.ink05}}; display: inline-flex; align-items: center; gap: 2px; color: {{c.ink60}};">
          <span style="width: 22px; height: 20px; display: grid; place-items: center;"><span style="width: 6px; height: 6px; border-radius: 999px; background: currentColor;"></span></span>
          <span style="width: 22px; height: 20px; border-radius: 6px; background: {{c.paper}}; box-shadow: {{c.shadowSm}}; display: grid; place-items: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><rect x="12" y="12" width="6" height="4" rx="1"></rect></svg></span>
          <span style="width: 22px; height: 20px; display: grid; place-items: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg></span>
        </span>
      </div>
      <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 8px 12px 10px; box-sizing: border-box;">
        <div style="align-self: flex-end; max-width: 82%; background: {{c.ink}}; color: {{c.paper}}; border-radius: 10px; padding: 7px 10px; font-size: 12px; line-height: 1.45;">{{t.ask}}</div>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{c.ink60}};">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>
          <span>{{t.process}}</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </div>
      </div>
    </sc-if>
    <section aria-label="{{cardName}}" style="flex-shrink: 0; margin: {{cardMargin}}; width: {{cardW}}px; box-sizing: border-box; border: 1px solid {{cardEdge}}; border-radius: 10px; background: {{c.paper}}; overflow: hidden;">
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; font-size: 12px;">
        <h3 style="margin: 0; font-size: 13px; font-weight: 600; color: {{c.ink}}; display: flex; align-items: center; gap: 6px; min-width: 0; line-height: 18px;">
          <sc-if value="{{spin}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="color: {{c.accent}}; flex-shrink: 0;"><path d="M12 3a9 9 0 1 0 9 9"></path></svg></sc-if>
          <sc-if value="{{alert}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{c.dangerInk}}; flex-shrink: 0;"><path d="M12 9v4"></path><path d="M10.36 3.59L2.26 17.13a1.91 1.91 0 0 0 1.64 2.87h16.2a1.91 1.91 0 0 0 1.64-2.87L13.64 3.59a1.91 1.91 0 0 0-3.28 0z"></path><path d="M12 16h.01"></path></svg></sc-if>
          <span style="min-width: 0;">{{title}}</span>
        </h3>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{cells}}" as="cell" hint-placeholder-count="3">
            <div style="position: relative; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
              <div title="{{cell.full}}" style="height: 22px; display: flex; align-items: center; min-width: 0; font-size: 12px; font-weight: 600; color: {{cell.titleColor}};">
                <span style="display: flex; min-width: 0;">
                  <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: pre;">{{cell.head}}</span>
                  <span style="flex-shrink: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: pre;">{{cell.tail}}</span>
                </span>
              </div>
              <div style="position: relative; width: 100%; aspect-ratio: 16 / 9;">
                <div style="position: absolute; left: {{cell.fl}}; top: 0; width: {{cell.fw}}; height: 100%; border-radius: 6px; background: {{cell.frameBg}}; box-shadow: {{cell.ring}}; overflow: hidden; display: grid; place-items: center;">
                  <sc-if value="{{cell.icon}}" hint-placeholder-val="{{ true }}">
                    <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 999px; background: {{cell.phBg}}; color: {{cell.phColor}}; display: grid; place-items: center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="M21 16l-5-5-9 8"></path></svg></span>
                  </sc-if>
                  <sc-if value="{{cell.chip}}" hint-placeholder-val="{{ false }}">
                    <span title="{{cell.chipText}}" style="max-width: calc(100% - 12px); height: 20px; padding: 0 7px; border-radius: 999px; background: {{cell.phBg}}; color: {{cell.chipColor}}; font-size: 11px; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; overflow: hidden; box-sizing: border-box;">
                      <sc-if value="{{cell.pLocate}}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0;"><circle cx="12" cy="12" r="7"></circle><path d="M12 3v2M3 12h2M12 19v2M19 12h2"></path></svg></sc-if>
                      <sc-if value="{{cell.pSpin}}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; color: {{cell.spinColor}};"><path d="M12 3a9 9 0 1 0 9 9"></path></svg></sc-if>
                      <sc-if value="{{cell.pClock}}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg></sc-if>
                      <sc-if value="{{cell.pAlert}}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 9v4"></path><path d="M10.36 3.59L2.26 17.13a1.91 1.91 0 0 0 1.64 2.87h16.2a1.91 1.91 0 0 0 1.64-2.87L13.64 3.59a1.91 1.91 0 0 0-3.28 0z"></path><path d="M12 16h.01"></path></svg></sc-if>
                      <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis;">{{cell.chipText}}</span>
                    </span>
                  </sc-if>
                </div>
                <sc-if value="{{cell.dim}}" hint-placeholder-val="{{ false }}">
                  <div aria-hidden="true" style="position: absolute; inset: 0; border-radius: 6px; background: {{cell.dimBg}};"></div>
                </sc-if>
                <sc-if value="{{cell.restore}}" hint-placeholder-val="{{ false }}">
                  <button type="button" aria-label="{{cell.restoreName}}" title="{{cell.restoreName}}" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; height: 22px; padding: 0 9px; border: 0; border-radius: 999px; background: {{cell.restoreBg}}; color: {{cell.restoreColor}}; box-shadow: {{cell.restoreShadow}}; font: inherit; font-size: 11px; font-weight: 500; white-space: nowrap; box-sizing: border-box; cursor: pointer;">{{cell.restoreText}}</button>
                </sc-if>
                <sc-if value="{{cell.x}}" hint-placeholder-val="{{ false }}">
                  <button type="button" aria-label="{{cell.excludeName}}" title="{{cell.excludeName}}" style="position: absolute; left: {{cell.xLeft}}; top: -8px; z-index: 6; width: 24px; height: 24px; padding: 0; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer;">
                    <span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 999px; background: {{cell.xBg}}; color: {{cell.xColor}}; box-shadow: {{cell.xHalo}}; display: grid; place-items: center;"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg></span>
                  </button>
                </sc-if>
              </div>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{summary}}" hint-placeholder-val="{{ true }}">
          <p title="{{summary}}" style="margin: 0; font-size: 12px; line-height: 18px; color: {{c.ink60}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{summary}}</p>
        </sc-if>
        <sc-if value="{{reason}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; font-size: 12px; line-height: 18px; color: {{c.dangerInk}};">{{reason}}</p>
        </sc-if>
      </div>
      <div style="border-top: 1px solid {{c.lineSoft}}; padding: 8px 10px; display: flex; align-items: center; gap: 6px; font-size: 12px;">
        <sc-if value="{{hint}}" hint-placeholder-val="{{ false }}">
          <span style="min-width: 0; color: {{c.ink60}};">{{hint}}</span>
        </sc-if>
        <span style="flex: 1;"></span>
        <button type="button" style="height: 28px; padding: 0 12px; border-radius: 7px; border: 1px solid {{c.lineSoft}}; background: {{c.paper}}; color: {{c.ink}}; font: inherit; font-size: 12px; flex-shrink: 0; box-sizing: border-box;">{{secondary}}</button>
        <sc-if value="{{primary}}" hint-placeholder-val="{{ true }}">
          <button type="button" disabled="{{primaryDisabled}}" style="height: 28px; min-width: 80px; padding: 0 12px; border-radius: 7px; border: 0; background: {{c.ink}}; color: {{c.paper}}; font: inherit; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; opacity: {{primaryOpacity}}; flex-shrink: 0; box-sizing: border-box; white-space: nowrap;">{{primary}}<span aria-hidden="true" style="font-size: 11px; opacity: 0.7;">⏎</span></button>
        </sc-if>
      </div>
    </section>
    <sc-if value="{{panel}}" hint-placeholder-val="{{ true }}">
      <div style="margin: 10px 11px 11px; flex-shrink: 0; border: 1px solid {{c.line}}; border-radius: 10px; background: {{c.paper}}; padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box;">
        <span style="font-size: 13px; color: {{c.ink40}};">{{t.placeholder}}</span>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: {{c.ink80}};">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l14 7-6 2-2 6z"></path></svg>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          <span style="display: inline-flex; align-items: center; gap: 4px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg>Skill</span>
          <span style="flex: 1;"></span>
          <span style="display: inline-flex; align-items: center; gap: 2px;">{{t.permission}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
          <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; border: 1.5px solid {{c.ink}}; display: grid; place-items: center; box-sizing: border-box;"><span style="width: 9px; height: 9px; border-radius: 2px; background: {{c.ink}};"></span></span>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"locale":{"editor":"enum","options":["zh","en"],"default":"zh"},"scheme":{"editor":"enum","options":["light","dark"],"default":"light"},"fit":{"editor":"enum","options":["wide","narrow"],"default":"wide"},"plan":{"editor":"enum","options":["one","two"],"default":"one"},"phase":{"editor":"enum","options":["focus","excluded","remaining","mixed","sending","failure","nothing"],"default":"focus"},"chrome":{"editor":"enum","options":["panel","card"],"default":"panel"},"hovered":{"editor":"enum","options":["none","1","2","3"],"default":"none"},"$preview":{"width":384,"height":500}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const zh = p.locale !== 'en';
    const dark = p.scheme === 'dark';
    const narrow = p.fit === 'narrow';
    const two = p.plan === 'two';
    const phase = p.phase || 'focus';
    const panel = p.chrome !== 'card';
    // 鼠标停在 / 键盘 Tab 到哪一格（1–3）：那一格和画布上的节点一起亮，右上角露出 ×。
    const hovered = p.hovered && p.hovered !== 'none' ? Number(p.hovered) - 1 : -1;
    const c = dark ? {
      bg: 'oklch(0.18 0.006 80)', paper: 'oklch(0.235 0.007 80)', ink: 'oklch(0.93 0.006 85)', ink80: 'oklch(0.84 0.006 85)',
      ink60: 'oklch(0.70 0.006 85)', ink40: 'oklch(0.62 0.006 85)', ink05: 'oklch(0.30 0.006 85)', line: 'oklch(0.36 0.007 80)',
      lineSoft: 'oklch(0.31 0.007 80)', accent: 'oklch(0.70 0.13 250)', dangerInk: 'oklch(0.82 0.13 25)', dangerEdge: 'oklch(0.4 0.07 25)',
      paper85: 'oklch(0.235 0.007 80 / 0.85)', paper60: 'oklch(0.235 0.007 80 / 0.6)',
      shadowSm: '0 1px 2px oklch(0 0 0 / 0.32), 0 1px 1px oklch(0 0 0 / 0.22)',
      shadowMd: '0 2px 5px oklch(0 0 0 / 0.30), 0 14px 34px oklch(0 0 0 / 0.32)'
    } : {
      bg: 'oklch(0.985 0.003 90)', paper: 'oklch(1 0 0)', ink: 'oklch(0.22 0.01 80)', ink80: 'oklch(0.32 0.01 80)',
      ink60: 'oklch(0.50 0.01 80)', ink40: 'oklch(0.68 0.01 80)', ink05: 'oklch(0.97 0.003 80)', line: 'oklch(0.91 0.004 80)',
      lineSoft: 'oklch(0.95 0.003 80)', accent: 'oklch(0.55 0.13 250)', dangerInk: 'oklch(0.45 0.13 25)', dangerEdge: 'oklch(0.895 0.052 25)',
      paper85: 'oklch(1 0 0 / 0.85)', paper60: 'oklch(1 0 0 / 0.6)',
      shadowSm: '0 1px 2px oklch(0 0 0 / 0.04), 0 1px 1px oklch(0 0 0 / 0.03)',
      shadowMd: '0 2px 4px oklch(0 0 0 / 0.04), 0 8px 24px oklch(0 0 0 / 0.06)'
    };
    const t = zh ? {
      ask: '画 3 张雨后纸船的图，起草好给我确认。', process: '准备生成', used: '已用 11',
      placeholder: '可继续输入，将排队发送…', permission: '请求批准', card: '付费卡',
      cancel: '取消', decline: '先不发了', retry: '再试一次', generate: '生成',
      restore: '恢复', excludeName: '{shot}不生成', restoreName: '{shot}恢复生成',
      located: '已定位', generating: '生成中', submitting: '提交中', queued: '排队中', failed: '失败', notYet: '还没发',
      sendingTitle: '正在发出 2/3 张', stopHint: '点「取消」停下剩下的',
      failTitle: '镜头 2 没有发出去', failReason: '服务暂时不可用。', nothingTitle: '没有要生成的了',
      title: '生成这些图片？', titleRemaining: '生成剩下的图片？',
      titleN: (n) => '生成这 ' + n + ' 张图片？', titleRemainingN: (n) => '生成剩下的 ' + n + ' 张图片？',
      generateN: (n) => '生成 ' + n + ' 张',
      summary: 'GPT Image 2（Nomi 选的）· 16:9 · 1K', summaryMixed: 'GPT Image 2（Nomi 选的）· 1K · 16:9 ×2 · 9:16 ×1',
      summaryCell: (ratio) => 'GPT Image 2（Nomi 选的）· ' + ratio + ' · 1K',
      head: '雨后纸船 · ', tails: ['出发', '越过落叶', '停在石阶']
    } : {
      ask: 'Draw 3 rainy paper-boat images and let me confirm the drafts.', process: 'Prepare generation', used: 'Used 11',
      placeholder: 'Keep typing — it will be queued…', permission: 'Ask first', card: 'Spend card',
      cancel: 'Cancel', decline: "Don't send", retry: 'Try again', generate: 'Generate',
      restore: 'Restore', excludeName: 'Skip {shot}', restoreName: 'Restore {shot}',
      located: 'Located', generating: 'Generating', submitting: 'Submitting', queued: 'Queued', failed: 'Failed', notYet: 'Not sent yet',
      sendingTitle: 'Sending 2 of 3 images', stopHint: 'Cancel to stop the rest',
      failTitle: "Shot 2 wasn't sent", failReason: 'The service is unavailable right now.', nothingTitle: 'Nothing left to generate',
      title: 'Generate these images?', titleRemaining: 'Generate the remaining images?',
      titleN: (n) => 'Generate these ' + n + ' images?', titleRemainingN: (n) => 'Generate the remaining ' + n + ' images?',
      generateN: (n) => 'Generate ' + n + ' images',
      summary: "GPT Image 2 (Nomi's pick) · 16:9 · 1K", summaryMixed: "GPT Image 2 (Nomi's pick) · 1K · 16:9 ×2 · 9:16 ×1",
      summaryCell: (ratio) => "GPT Image 2 (Nomi's pick) · " + ratio + ' · 1K',
      head: 'Paper boat — ', tails: ['sets off', 'drifts by', 'rests']
    };

    const raw = t.tails.map((tail) => ({ tail: tail, dim: false, lit: false, pill: '', portrait: false, failed: false }));
    if (phase === 'focus') { raw[0].lit = true; raw[0].pill = 'located'; }
    if (phase === 'excluded') { raw[2].dim = true; }
    if (phase === 'remaining') { raw[0].pill = 'generating'; }
    if (phase === 'mixed') { raw[2].portrait = true; }
    if (phase === 'sending') { raw[0].pill = 'generating'; raw[1].pill = 'submitting'; raw[2].pill = 'queued'; }
    if (phase === 'failure') { raw[0].pill = 'generating'; raw[1].pill = 'failed'; raw[1].failed = true; raw[2].pill = 'notYet'; }
    if (phase === 'nothing') { raw.forEach((cell) => { cell.dim = true; }); }

    // 还在确认的卡才给 ×；已经在跑 / 失败 / 还没发的那一格不给（它不归这一下管）。
    const confirming = phase === 'focus' || phase === 'excluded' || phase === 'remaining' || phase === 'mixed';
    const inFlight = { generating: true, submitting: true, queued: true, failed: true, notYet: true };
    const words = { located: t.located, generating: t.generating, submitting: t.submitting, queued: t.queued, failed: t.failed, notYet: t.notYet };
    const cells = raw.map((cell, i) => {
      const full = t.head + cell.tail;
      const lit = cell.lit || i === hovered;
      return {
        head: t.head, tail: cell.tail, full: full,
        titleColor: c.ink,
        fl: cell.portrait ? '34.18%' : '0', fw: cell.portrait ? '31.64%' : '100%',
        ring: lit ? '0 0 0 1.5px ' + c.ink + ', ' + c.shadowMd : cell.failed ? 'inset 0 0 0 1px ' + c.dangerEdge : 'inset 0 0 0 1px ' + c.line,
        frameBg: c.paper, phBg: c.ink05, phColor: c.ink40,
        // 中间只放一样东西：没状态是图标，有状态是「图标 + 字」，去掉了是「恢复」。
        icon: !cell.pill && !cell.dim,
        chip: Boolean(cell.pill), chipText: cell.pill ? words[cell.pill] : '',
        chipColor: cell.failed ? c.dangerInk : c.ink60,
        pLocate: cell.pill === 'located', pSpin: cell.pill === 'generating' || cell.pill === 'submitting',
        pClock: cell.pill === 'queued', pAlert: cell.pill === 'failed', spinColor: c.accent,
        dim: cell.dim, dimBg: c.paper60,
        restore: cell.dim, restoreText: t.restore, restoreName: t.restoreName.replace('{shot}', full),
        restoreBg: c.paper, restoreColor: c.ink, restoreShadow: c.shadowSm + ', 0 0 0 1px ' + c.line,
        // × 骑在画面框右上角（竖图就骑在竖框自己的角上），和输入框里参考图的 × 同一个样子；只在亮着的那一格露出来。
        x: confirming && lit && !cell.dim && !inFlight[cell.pill],
        xLeft: cell.portrait ? 'calc(65.82% - 16px)' : 'calc(100% - 16px)',
        excludeName: t.excludeName.replace('{shot}', full),
        xBg: c.ink, xColor: c.paper, xHalo: '0 0 0 1.5px ' + c.paper
      };
    });

    const sendable = phase === 'excluded' || phase === 'remaining' ? 2 : 3;
    let title = '';
    let primary = '';
    let primaryDisabled = false;
    let secondary = t.cancel;
    let hint = '';
    let reason = '';
    let summary = '';
    let spin = false;
    let alert = false;
    if (phase === 'sending') {
      title = t.sendingTitle; spin = true; hint = t.stopHint;
    } else if (phase === 'failure') {
      title = t.failTitle; alert = true; reason = t.failReason; secondary = t.decline; primary = t.retry;
    } else if (phase === 'nothing') {
      title = t.nothingTitle; primary = t.generate; primaryDisabled = true;
    } else {
      const remaining = phase === 'remaining';
      if (two) {
        title = remaining ? t.titleRemainingN(sendable) : t.titleN(sendable);
        primary = t.generate;
      } else {
        title = remaining ? t.titleRemaining : t.title;
        primary = t.generateN(sendable);
      }
      if (phase !== 'mixed') summary = t.summary;
      else summary = hovered >= 0 ? t.summaryCell(raw[hovered].portrait ? '9:16' : '16:9') : t.summaryMixed;
    }

    const panelW = narrow ? 320 : 384;
    const cardW = panelW - 22;
    return {
      c: c, t: t, panel: panel,
      rootW: panel ? panelW : cardW,
      rootH: panel ? '500px' : 'auto',
      rootBg: panel ? c.bg : 'transparent',
      shellH: panel ? '100%' : 'auto',
      shellRadius: panel ? '16px' : '0',
      shellBorder: panel ? '1px solid ' + c.line : '0',
      shellBg: panel ? c.paper : 'transparent',
      shellShadow: panel ? c.shadowMd : 'none',
      cardW: cardW,
      cardMargin: panel ? '0 11px' : '0',
      cardEdge: phase === 'failure' ? c.dangerEdge : c.ink40,
      cardName: t.card,
      title: title, spin: spin, alert: alert,
      cells: cells,
      summary: summary, reason: reason, hint: hint,
      secondary: secondary, primary: primary,
      primaryDisabled: primaryDisabled, primaryOpacity: primaryDisabled ? 0.4 : 1
    };
  }
}
</script>

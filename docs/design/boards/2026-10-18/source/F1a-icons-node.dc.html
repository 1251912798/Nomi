<style>

body{margin:0}
.light{--nomi-logo-ground:oklch(.22 .01 80);--nomi-bg:oklch(.985 .003 90);--nomi-paper:oklch(1 0 0);--nomi-ink:oklch(.22 .01 80);--nomi-ink80:oklch(.32 .01 80);--nomi-ink60:oklch(.5 .01 80);--nomi-ink40:oklch(.68 .01 80);--nomi-ink10:oklch(.94 .003 80);--nomi-ink05:oklch(.97 .003 80);--nomi-line:oklch(.91 .004 80);--nomi-line-soft:oklch(.95 .003 80);--nomi-accent:oklch(.55 .13 250);--nomi-accent-soft:color-mix(in srgb,var(--nomi-accent) 12%,var(--nomi-paper));--nomi-danger:oklch(.55 .13 25);--nomi-danger-ink:oklch(.45 .13 25);--nomi-danger-soft:oklch(.955 .021 25);--nomi-danger-edge:oklch(.895 .052 25);--nomi-warning-ink:oklch(.45 .085 72);--nomi-warning-soft:oklch(.968 .024 72);--nomi-success-ink:oklch(.45 .09 145);--nomi-success-soft:oklch(.962 .033 145);--nomi-shadow-sm:0 1px 2px oklch(0 0 0/0.04),0 1px 1px oklch(0 0 0/0.03);--nomi-shadow-md:0 2px 4px oklch(0 0 0/0.04),0 8px 24px oklch(0 0 0/0.06);--nomi-shadow-lg:0 4px 8px oklch(0 0 0/0.05),0 20px 50px oklch(0 0 0/0.08)}
.dark{--nomi-logo-ground:oklch(.30 .01 80);--nomi-bg:oklch(.18 .006 80);--nomi-paper:oklch(.235 .007 80);--nomi-ink:oklch(.93 .006 85);--nomi-ink80:oklch(.84 .006 85);--nomi-ink60:oklch(.7 .006 85);--nomi-ink40:oklch(.62 .006 85);--nomi-ink10:oklch(.34 .006 85);--nomi-ink05:oklch(.3 .006 85);--nomi-line:oklch(.36 .007 80);--nomi-line-soft:oklch(.31 .007 80);--nomi-accent:oklch(.7 .13 250);--nomi-accent-soft:color-mix(in srgb,var(--nomi-accent) 26%,var(--nomi-paper));--nomi-danger:oklch(.72 .13 25);--nomi-danger-ink:oklch(.82 .13 25);--nomi-danger-soft:oklch(.3 .048 25);--nomi-danger-edge:oklch(.4 .07 25);--nomi-warning-ink:oklch(.82 .085 72);--nomi-warning-soft:oklch(.295 .04 72);--nomi-success-ink:oklch(.82 .09 145);--nomi-success-soft:oklch(.295 .042 145);--nomi-shadow-sm:0 1px 2px oklch(0 0 0/0.32),0 1px 1px oklch(0 0 0/0.22);--nomi-shadow-md:0 2px 5px oklch(0 0 0/0.30),0 14px 34px oklch(0 0 0/0.32);--nomi-shadow-lg:0 4px 10px oklch(0 0 0/0.30),0 24px 64px oklch(0 0 0/0.40)}
.root{--nomi-radius-sm:6px;--nomi-radius:10px;--nomi-radius-lg:16px;box-sizing:border-box;background-color:var(--nomi-bg);color:var(--nomi-ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:13px;line-height:1.5}
.root *{box-sizing:border-box}
.dots{background-image:radial-gradient(var(--nomi-ink10) 1px,transparent 1px);background-size:18px 18px}
.row{display:flex;align-items:flex-start}
.cap{font-size:12px;color:var(--nomi-ink60);margin:0 0 8px 4px}
.note{margin:10px 0 0 4px;font-size:12px;line-height:1.5;color:var(--nomi-ink60)}
button{font-family:inherit;cursor:default}
.ib{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:1px solid var(--nomi-line);border-radius:999px;background:var(--nomi-paper);color:var(--nomi-ink80)}
.ib.bare{border-color:transparent;background:transparent}
.tb{flex:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border:0;border-radius:var(--nomi-radius-sm);background:var(--nomi-ink05);color:var(--nomi-ink80)}
.vsep{flex:none;width:1px;height:20px;background:var(--nomi-line)}
.chip{flex:none;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border:1px solid var(--nomi-line);border-radius:999px;background:var(--nomi-paper);color:var(--nomi-ink80);font:inherit;font-size:12px;white-space:nowrap}
.chip.open{background:var(--nomi-accent-soft);color:var(--nomi-ink);border-color:transparent}
.chip.bad{color:var(--nomi-danger-ink);border-color:var(--nomi-danger-edge)}
.send{flex:none;width:30px;height:30px;padding:0;border:0;border-radius:999px;background:var(--nomi-ink);color:var(--nomi-paper);display:flex;align-items:center;justify-content:center}
.sendtxt{flex:none;height:30px;padding:0 12px 0 14px;border:0;border-radius:999px;background:var(--nomi-ink);color:var(--nomi-paper);font:inherit;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--nomi-line);background:var(--nomi-paper);color:var(--nomi-ink);font:inherit;font-size:13px;font-weight:500;white-space:nowrap}
.btn.pri{background:var(--nomi-ink);border-color:var(--nomi-ink);color:var(--nomi-paper)}
.btn.txt{border-color:transparent;background:transparent;color:var(--nomi-ink60)}
.btn.danger{background:var(--nomi-danger);border-color:var(--nomi-danger);color:var(--nomi-paper)}
.lk{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 6px;border:0;border-radius:999px;background:transparent;color:var(--nomi-accent);font:inherit;font-size:12px;white-space:nowrap}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:var(--nomi-ink05);color:var(--nomi-ink60);font-size:12px;white-space:nowrap}
.sp{flex:1;min-width:0}
/* 节点卡 */
.node{position:relative;box-sizing:border-box;padding:12px;background:var(--nomi-paper);border:1px solid var(--nomi-line);border-radius:var(--nomi-radius);box-shadow:var(--nomi-shadow-md)}
.refs{display:flex;align-items:flex-start;gap:8px;min-height:40px}
.t{position:relative;flex:none;width:40px;height:40px}
.t svg.img{display:block;border-radius:var(--nomi-radius-sm)}
.cnt{margin-left:auto;align-self:center;font-size:12px;color:var(--nomi-ink60);white-space:nowrap}
.prompt{position:relative;padding:8px 36px 8px 4px;min-height:36px;font-size:14px;line-height:1.9}
.prompt .ib{position:absolute;right:0;top:4px}
.m{display:inline-flex;align-items:center;gap:4px;padding:0 8px 0 3px;border-radius:999px;background:var(--nomi-accent-soft);color:var(--nomi-ink);font-weight:500;font-size:13px;line-height:1.5;vertical-align:baseline}
.m svg{display:block;border-radius:4px}
.bar{display:flex;flex-wrap:nowrap;align-items:center;gap:4px;padding-top:4px}
/* Agent 面板 */
.panel{width:360px;display:flex;flex-direction:column;border:1px solid var(--nomi-line);border-radius:var(--nomi-radius-lg);background:var(--nomi-paper);box-shadow:var(--nomi-shadow-lg);overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 12px;border-bottom:1px solid var(--nomi-line-soft);flex:none}
.wm{font-family:Fraunces,Georgia,serif;font-size:16px;letter-spacing:-.02em;color:var(--nomi-ink)}
.wm b{font-weight:400;color:var(--nomi-accent)}
.pmsg{padding:10px 14px;font-size:13px;color:var(--nomi-ink60)}
.pslot{padding:0 12px 12px}
.pin{margin:0 12px 12px;border:1px solid var(--nomi-line);border-radius:var(--nomi-radius);padding:0 12px;display:flex;align-items:center;height:44px;color:var(--nomi-ink60);font-size:13px}
/* 付费确认卡 */
.sc{border:1px solid var(--nomi-ink40);border-radius:var(--nomi-radius);background:var(--nomi-paper);padding:12px;display:flex;flex-direction:column;gap:6px}
.sc-h{display:flex;align-items:center;gap:8px;min-height:22px}
.sc-t{font-size:14px;font-weight:600;color:var(--nomi-ink)}
.sc-s{display:flex;align-items:center;gap:6px;min-height:24px;font-size:13px;color:var(--nomi-ink80)}
.sc-s .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-s .idx,.li .idx{font-variant-numeric:tabular-nums;color:var(--nomi-ink60);font-size:12px}
.sc-p{display:flex;align-items:flex-start;gap:6px}
.pt{flex:1;min-width:0;margin:0;font-size:13px;line-height:20px;color:var(--nomi-ink80);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sc-c{display:flex;flex-wrap:wrap;gap:4px}
.sc-d{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding-top:2px}
.sc-d .btn{height:32px;padding:0 12px}
.sc-d .btn.txt{padding:0 8px}
.li{display:flex;align-items:center;gap:8px;min-height:28px;padding:0 8px;border-radius:var(--nomi-radius-sm);font-size:13px;color:var(--nomi-ink80)}
.li .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .st{margin-left:auto;font-size:12px;color:var(--nomi-ink60);white-space:nowrap}
.li.cur{background:var(--nomi-accent-soft);color:var(--nomi-ink)}
.li.fin{color:var(--nomi-ink60)}
.lst{display:flex;flex-direction:column;gap:2px}
.ok{color:var(--nomi-success-ink)}
.bad-i{color:var(--nomi-danger-ink)}
.warn-i{color:var(--nomi-warning-ink)}
.fact{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:20px;color:var(--nomi-ink)}
.fact svg{flex:none;margin-top:2px}
.fact small{display:block;font-size:12px;line-height:18px;color:var(--nomi-ink60)}
.spin{animation:none}

</style>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>拆解表 · 全屏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:oklch(0.55 0.13 250)}a:hover{color:oklch(0.45 0.13 250)}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: oklch(0.985 0.003 90); font-family: Inter, -apple-system, 'PingFang SC', sans-serif; color: oklch(0.22 0.01 80); font-size: 13px; display: flex; flex-direction: column">
  <div style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid oklch(0.91 0.004 80); background: oklch(1 0 0)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.50 0.01 80)" stroke-width="1.5" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/></svg>
    <span style="font-size: 15px; font-weight: 500">拆解表 · 雨夜参考片</span>
    <span style="font-size: 12px; color: oklch(0.68 0.01 80)">5 镜 · 15s</span>
    <div style="margin-left: 24px; display: flex; align-items: center; gap: 6px">
      <button style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid oklch(0.91 0.004 80); border-radius: 8px; background: oklch(1 0 0); font: inherit; font-size: 12.5px; cursor: pointer">显示列 · 9/10<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div role="group" aria-label="行高" style="display: flex; height: 30px; border: 1px solid oklch(0.91 0.004 80); border-radius: 8px; overflow: hidden; font-size: 12.5px">
        <button style="padding: 0 10px; border: 0; background: oklch(1 0 0); font: inherit; color: oklch(0.50 0.01 80); cursor: pointer">紧凑</button>
        <button aria-pressed="true" style="padding: 0 10px; border: 0; border-left: 1px solid oklch(0.91 0.004 80); border-right: 1px solid oklch(0.91 0.004 80); background: oklch(0.97 0.003 80); font: inherit; font-weight: 500; cursor: pointer">标准</button>
        <button style="padding: 0 10px; border: 0; background: oklch(1 0 0); font: inherit; color: oklch(0.50 0.01 80); cursor: pointer">大图</button>
      </div>
    </div>
    <button style="margin-left: auto; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid oklch(0.91 0.004 80); border-radius: 8px; background: oklch(1 0 0); font: inherit; font-size: 12.5px; cursor: pointer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>退出全屏 · Esc</button>
  </div>
  <div style="flex: 1; min-height: 0; display: flex">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 16px 0 16px 20px">
      <div style="flex: 1; background: oklch(1 0 0); border: 1px solid oklch(0.91 0.004 80); border-radius: 10px; overflow: hidden">
        <div style="display: grid; grid-template-columns: 36px 40px 128px 72px 80px 96px minmax(0, 1fr) 180px 96px 72px; align-items: center; height: 36px; padding: 0 10px; font-size: 12px; color: oklch(0.50 0.01 80); background: oklch(0.985 0.003 90); border-bottom: 1px solid oklch(0.95 0.003 80)">
          <span></span><span>镜</span><span>关键帧</span><span>时长</span><span>景别</span><span>运镜</span><span>画面</span><span>对白</span><span>情绪</span><span>状态</span>
        </div>
        <sc-for list="{{rows}}" as="row" hint-placeholder-count="5">
          <div style="display: grid; grid-template-columns: 36px 40px 128px 72px 80px 96px minmax(0, 1fr) 180px 96px 72px; align-items: center; min-height: 92px; padding: 0 10px; border-bottom: 1px solid oklch(0.95 0.003 80); font-size: 13px; background: {{row.bg}}">
            <input type="checkbox" aria-label="选中这一镜" style="width: 14px; height: 14px; margin: 0">
            <span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: oklch(0.50 0.01 80)">{{row.no}}</span>
            <div style="width: 116px; height: 66px; border-radius: 6px; background: {{row.thumb}}"></div>
            <span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px">{{row.time}}</span>
            <span style="color: {{row.ink}}">{{row.size}}</span>
            <span style="color: {{row.ink}}">{{row.move}}</span>
            <span style="color: {{row.ink}}; padding-right: 16px; line-height: 1.5">{{row.desc}}</span>
            <span style="color: {{row.ink}}; padding-right: 12px; line-height: 1.5">{{row.line}}</span>
            <span style="color: {{row.ink}}">{{row.mood}}</span>
            <span style="font-size: 12px; color: {{row.statusInk}}">{{row.status}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <aside aria-label="镜 02 详情" style="width: 380px; box-sizing: border-box; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 14px; font-weight: 500">镜 02</span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: oklch(0.50 0.01 80)">3.0s – 6.0s</span>
        <button style="margin-left: auto; height: 28px; padding: 0 10px; border: 1px solid oklch(0.91 0.004 80); border-radius: 8px; background: oklch(1 0 0); font: inherit; font-size: 12px; cursor: pointer">在原片里播放</button></div>
      <div style="width: 340px; height: 191px; border-radius: 10px; background: linear-gradient(160deg, oklch(0.45 0.05 40), oklch(0.25 0.03 30))"></div>
      <div style="display: flex; gap: 6px">
        <div style="width: 64px; height: 36px; border-radius: 4px; background: linear-gradient(160deg, oklch(0.42 0.05 40), oklch(0.24 0.03 30)); outline: 1.5px solid oklch(0.32 0.01 80)"></div>
        <div style="width: 64px; height: 36px; border-radius: 4px; background: linear-gradient(160deg, oklch(0.47 0.05 45), oklch(0.26 0.03 30))"></div>
        <div style="width: 64px; height: 36px; border-radius: 4px; background: linear-gradient(160deg, oklch(0.50 0.05 50), oklch(0.27 0.03 35))"></div>
        <span style="align-self: center; font-size: 11px; color: oklch(0.50 0.01 80)">读图用的 3 帧</span>
      </div>
      <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); row-gap: 8px; column-gap: 10px; font-size: 13px; align-items: start">
        <label for="f-size" style="color: oklch(0.50 0.01 80); padding-top: 6px">景别</label><input id="f-size" value="特写" style="height: 30px; padding: 0 8px; border: 1px solid oklch(0.91 0.004 80); border-radius: 6px; font: inherit">
        <label for="f-move" style="color: oklch(0.50 0.01 80); padding-top: 6px">运镜</label><input id="f-move" value="缓慢推近" style="height: 30px; padding: 0 8px; border: 1px solid oklch(0.91 0.004 80); border-radius: 6px; font: inherit">
        <label for="f-desc" style="color: oklch(0.50 0.01 80); padding-top: 6px">画面</label><textarea id="f-desc" rows="3" style="padding: 6px 8px; border: 1px solid oklch(0.91 0.004 80); border-radius: 6px; font: inherit; resize: vertical">女孩握紧旧照片，回头望向巷口</textarea>
        <label for="f-line" style="color: oklch(0.50 0.01 80); padding-top: 6px">对白</label><input id="f-line" value="" placeholder="这一镜没有对白" style="height: 30px; padding: 0 8px; border: 1px solid oklch(0.91 0.004 80); border-radius: 6px; font: inherit">
        <label for="f-mood" style="color: oklch(0.50 0.01 80); padding-top: 6px">情绪</label><input id="f-mood" value="悬念" style="height: 30px; padding: 0 8px; border: 1px solid oklch(0.91 0.004 80); border-radius: 6px; font: inherit">
      </div>
      <div style="font-size: 11px; color: oklch(0.50 0.01 80)">改了自动保存；读图模型 Gemini 3.5 Flash · 转写 本机 Whisper</div>
      <div style="display: flex; gap: 8px; margin-top: auto">
        <button style="height: 32px; padding: 0 12px; border: 1px solid oklch(0.91 0.004 80); border-radius: 8px; background: oklch(1 0 0); font: inherit; font-size: 12.5px; cursor: pointer">只重拆这一镜</button>
        <button style="margin-left: auto; height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: oklch(0.22 0.01 80); font: inherit; font-size: 12.5px; font-weight: 500; color: oklch(1 0 0); cursor: pointer">用这一镜出分镜图</button>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ink = 'oklch(0.22 0.01 80)';
    const faint = 'oklch(0.68 0.01 80)';
    const ok = 'oklch(0.50 0.01 80)';
    const bad = 'oklch(0.45 0.13 25)';
    return {
      rows: [
        { no: '01', time: '0–3s', size: '全景', move: '定机位', desc: '雨夜，街口的灯映在积水中', line: '—', mood: '悬念', status: '已读', ink, statusInk: ok, bg: 'transparent', thumb: 'linear-gradient(160deg, oklch(0.34 0.05 250), oklch(0.22 0.03 270))' },
        { no: '02', time: '3–6s', size: '特写', move: '缓慢推近', desc: '女孩握紧旧照片，回头望向巷口', line: '—', mood: '悬念', status: '已读', ink, statusInk: ok, bg: 'oklch(0.97 0.003 80)', thumb: 'linear-gradient(160deg, oklch(0.45 0.05 40), oklch(0.25 0.03 30))' },
        { no: '03', time: '6–9s', size: '全景', move: '定机位', desc: '一束车灯穿过薄雾，照亮她的侧脸', line: '我一直在等你。', mood: '悬念', status: '已读', ink, statusInk: ok, bg: 'transparent', thumb: 'linear-gradient(160deg, oklch(0.55 0.06 80), oklch(0.28 0.03 260))' },
        { no: '04', time: '9–12s', size: '没读出', move: '没读出', desc: '没读出：You\'ve reached the API rate limit for free users', line: '你还记得这里吗？', mood: '没读出', status: '没读出 · 重拆', ink: faint, statusInk: bad, bg: 'transparent', thumb: 'linear-gradient(160deg, oklch(0.30 0.03 230), oklch(0.18 0.02 260))' },
        { no: '05', time: '12–15s', size: '全景', move: '定机位', desc: '风吹动纸页，镜头缓缓拉远', line: '—', mood: '释然', status: '已读', ink, statusInk: ok, bg: 'transparent', thumb: 'linear-gradient(160deg, oklch(0.62 0.04 90), oklch(0.40 0.03 60))' }
      ]
    };
  }
}
</script>
</body>
</html>

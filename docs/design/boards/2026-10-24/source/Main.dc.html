<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>技能库 · 修后</title>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.nm{--shell:#f6f5f3;--paper:oklch(1 0 0);--ink:oklch(0.22 0.01 80);--ink80:oklch(0.32 0.01 80);--ink60:oklch(0.50 0.01 80);--ink40:oklch(0.62 0.01 80);--ink30:oklch(0.78 0.01 80);--ink20:oklch(0.88 0.005 80);--ink10:oklch(0.94 0.003 80);--ink05:oklch(0.97 0.003 80);--line:oklch(0.91 0.004 80);--linesoft:oklch(0.95 0.003 80);--accent:oklch(0.55 0.13 250);--shsm:0 1px 2px oklch(0 0 0 / 0.04),0 1px 1px oklch(0 0 0 / 0.03);font-family:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.nm.dark{--shell:#0d0c09;--paper:oklch(0.235 0.007 80);--ink:oklch(0.93 0.006 85);--ink80:oklch(0.84 0.006 85);--ink60:oklch(0.70 0.006 85);--ink40:oklch(0.62 0.006 85);--ink30:oklch(0.50 0.006 85);--ink20:oklch(0.42 0.006 85);--ink10:oklch(0.34 0.006 85);--ink05:oklch(0.30 0.006 85);--line:oklch(0.36 0.007 80);--linesoft:oklch(0.31 0.007 80);--accent:oklch(0.70 0.13 250);--shsm:0 1px 2px oklch(0 0 0 / 0.32),0 1px 1px oklch(0 0 0 / 0.22)}
.nm .illus{filter:none}
.nm.dark .illus{filter:invert(.9) hue-rotate(180deg)}
.nm .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nm .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm button{font-family:inherit}
</style>
</helmet>
<div class="nm {{themeClass}}" style="width: 1440px; height: 900px; background: var(--shell); position: relative; overflow: hidden;">
  <div style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 76px; box-sizing: border-box;">
    <svg width="20" height="20" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="oklch(0.22 0.01 80)"></rect><path d="M7.5 20V8h2.6l7.4 8.4V8h2.6v12h-2.6L10.1 11.6V20z" fill="#fff"></path></svg>
    <span style="font-size: 13px; font-weight: 500;">{{s.appTitle}}</span>
    <span style="flex: 1;"></span>
    <div style="display: flex; align-items: center; gap: 2px;">
      <button type="button" aria-label="{{s.window}}" style="position: relative; width: 28px; height: 28px; border: 0; padding: 0; background: transparent; color: var(--ink60); display: grid; place-items: center; border-radius: 6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16"></path><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12"></path><path d="M8 4v4"></path></svg></button>
      <button type="button" aria-label="{{s.settings}}" style="position: relative; width: 28px; height: 28px; border: 0; padding: 0; background: transparent; color: var(--ink60); display: grid; place-items: center; border-radius: 6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065"></path><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"></path></svg><span aria-hidden="true" style="position: absolute; right: 5px; top: 5px; width: 6px; height: 6px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 2px var(--shell);"></span></button>
    </div>
  </div>
  <div style="position: absolute; left: 8px; top: 40px; right: 8px; bottom: 8px; background: var(--paper); border-radius: 10px; box-shadow: 0 0 0 1px var(--linesoft); display: flex; flex-direction: column; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 16px; padding: 24px 32px 0 32px; height: 32px;">
      <div role="tablist" aria-label="{{s.tabsAria}}" style="display: flex; align-items: baseline; gap: 20px;">
        <button type="button" role="tab" aria-selected="false" style="border: 0; background: transparent; padding: 0; height: 32px; font-size: 16px; font-weight: 600; color: var(--ink40);">{{s.tabProjects}}</button>
        <button type="button" role="tab" aria-selected="true" style="border: 0; background: transparent; padding: 0; height: 32px; font-size: 16px; font-weight: 600; color: var(--ink);">{{s.tabSkills}}</button>
        <button type="button" role="tab" aria-selected="false" style="border: 0; background: transparent; padding: 0; height: 32px; font-size: 16px; font-weight: 600; color: var(--ink40);">{{s.tabPrompts}}</button>
      </div>
      <label style="margin-left: 8px; display: flex; align-items: center; gap: 6px; width: 260px; height: 30px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink40);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7"></circle><path d="M21 21l-6-6"></path></svg>
        <input type="search" placeholder="{{s.search}}" aria-label="{{s.search}}" style="border: 0; outline: 0; background: transparent; font: inherit; font-size: 13px; color: var(--ink); width: 100%;">
      </label>
      <span style="flex: 1;"></span>
      <button type="button" aria-label="{{s.importName}}" title="{{s.importName}}" style="width: 28px; height: 28px; border-radius: 999px; border: 0; background: transparent; color: var(--ink60); display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path><path d="M7 9l5-5 5 5"></path><path d="M12 4v12"></path></svg></button>
      <button type="button" style="height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink80); font-size: 12px; font-weight: 500;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21l15-15-3-3-15 15 3 3"></path><path d="M15 6l3 3"></path><path d="M9 3a2 2 0 0 0 2 2 2 2 0 0 0-2 2 2 2 0 0 0-2-2 2 2 0 0 0 2-2"></path><path d="M19 13a2 2 0 0 0 2 2 2 2 0 0 0-2 2 2 2 0 0 0-2-2 2 2 0 0 0 2-2"></path></svg>{{s.newLabel}}</button>
    </div>
    <div style="display: flex; gap: 28px; padding: 20px 32px 0 32px; flex: 1; min-height: 0;">
      <nav aria-label="{{s.navAria}}" style="width: 176px; flex: none; display: flex; flex-direction: column; gap: 2px;">
        <sc-for list="{{navTop}}" as="n" hint-placeholder-count="2">
          <button type="button" aria-current="{{n.current}}" style="{{n.style}}"><span class="one">{{n.label}}</span><span style="font-size: 12px; color: var(--ink40); font-variant-numeric: tabular-nums;">{{n.count}}</span></button>
        </sc-for>
        <div style="margin: 14px 0 4px 10px; font-size: 11px; color: var(--ink40);">{{s.builtin}}</div>
        <sc-for list="{{navGroups}}" as="n" hint-placeholder-count="5">
          <button type="button" aria-current="{{n.current}}" style="{{n.style}}"><span class="one">{{n.label}}</span><span style="font-size: 12px; color: var(--ink40); font-variant-numeric: tabular-nums;">{{n.count}}</span></button>
        </sc-for>
      </nav>
      <main style="flex: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 22px;">
        <sc-for list="{{sections}}" as="sec" hint-placeholder-count="5">
          <section aria-label="{{sec.title}}" style="display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; align-items: baseline; gap: 8px; height: 24px;">
              <h3 style="margin: 0; font-size: 13px; font-weight: 600; color: var(--ink);">{{sec.title}}</h3>
              <sc-if value="{{sec.hasMore}}" hint-placeholder-val="{{ true }}">
                <a href="#" style="font-size: 12px; color: var(--ink60); text-decoration: none; display: inline-flex; align-items: center; gap: 2px;">{{sec.more}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
              </sc-if>
            </div>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
              <sc-for list="{{sec.items}}" as="it" hint-placeholder-count="3">
                <button type="button" style="height: 78px; box-sizing: border-box; display: flex; gap: 12px; align-items: flex-start; padding: 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); text-align: left; color: inherit;">
                  <span style="width: 88px; height: 55px; flex: none; border-radius: 6px; overflow: hidden; background: var(--ink05); display: grid; place-items: center; color: var(--ink30);">
                    <sc-if value="{{it.hasCover}}" hint-placeholder-val="{{ true }}">
                      <img class="{{it.cls}}" src="{{it.src}}" alt="" style="width: 88px; height: 55px; object-fit: cover; display: block;">
                    </sc-if>
                    <sc-if value="{{it.noCover}}" hint-placeholder-val="{{ false }}">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path><path d="M16 5.25l-8 4.5"></path></svg>
                    </sc-if>
                  </span>
                  <span style="min-width: 0; display: flex; flex-direction: column; gap: 3px;">
                    <strong class="one" style="font-size: 14px; line-height: 20px; font-weight: 600; color: var(--ink);">{{it.title}}</strong>
                    <span class="clamp2" style="font-size: 12px; line-height: 16px; color: var(--ink60);">{{it.summary}}</span>
                  </span>
                </button>
              </sc-for>
            </div>
          </section>
        </sc-for>
      </main>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"lang":{"editor":"enum","options":["zh","en"],"default":"zh"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {

    const dark = (this.props.theme ?? 'light') === 'dark';

    const T = (zh, e) => (en ? e : zh);
    const s = {
      appTitle: T('项目库', 'Projects'), window: T('窗口', 'Window'), settings: T('设置', 'Settings'),

      search: T('搜技能…', 'Search skills…'), importName: T('导入技能：SKILL.md、zip 或整个文件夹，也可以直接拖进来', 'Import a skill: SKILL.md, zip or a whole folder — or drop it here'),

    const sections = [
      sec(T('我的', 'Mine'), 1, [

        card(T('分镜规划', 'Storyboard planning'), T('把短故事拆成有序镜头，整理为可审阅的分镜方案。', 'Turn a short story into an ordered, reviewable storyboard plan.'), '/_blob/37d3e2fc1e81b5e205a7488814fdb5c3', false),

      ]),
      sec(T('编剧', 'Writing'), 11, [

        card(T('表情设定表', 'Character expression sheet'), T('按姿势参考生成同一角色的多种表情。', 'Create a set of distinct expressions for the same character.'), '/_blob/ff950a161c8452113a531bb947175698', true),
      ]),
    ];
    return { themeClass: dark ? 'dark' : '', s, navTop, navGroups, sections };
  }
}
</script>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>提示词详情 · 修后</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.nd{--paper:oklch(1 0 0);--ink:oklch(0.22 0.01 80);--ink80:oklch(0.32 0.01 80);--ink60:oklch(0.50 0.01 80);--ink40:oklch(0.62 0.01 80);--ink05:oklch(0.97 0.003 80);--line:oklch(0.91 0.004 80);--danger:oklch(0.55 0.13 25);--scrim:oklch(0.2 0.01 80 / 0.42);--shlg:0 4px 8px oklch(0 0 0 / 0.05),0 20px 50px oklch(0 0 0 / 0.08);font-family:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.nd.dark{--paper:oklch(0.235 0.007 80);--ink:oklch(0.93 0.006 85);--ink80:oklch(0.84 0.006 85);--ink60:oklch(0.70 0.006 85);--ink40:oklch(0.62 0.006 85);--ink05:oklch(0.30 0.006 85);--line:oklch(0.36 0.007 80);--danger:oklch(0.72 0.13 25);--scrim:oklch(0.08 0.004 80 / 0.58);--shlg:0 4px 10px oklch(0 0 0 / 0.35),0 24px 60px oklch(0 0 0 / 0.45)}
.nd .illus{filter:none}
.nd.dark .illus{filter:invert(.9) hue-rotate(180deg)}
.nd button{font-family:inherit}
</style>
</helmet>
<div class="nd {{themeClass}}" style="width: 1440px; height: 900px; position: relative; overflow: hidden;">
  <dc-import name="Prompt" theme="{{theme}}" lang="{{lang}}" view="all" hint-size="1440px,900px"></dc-import>
  <div style="position: absolute; inset: 0; background: var(--scrim);"></div>
  <div role="dialog" aria-label="{{d.title}}" style="position: absolute; left: 400px; top: 90px; width: 640px; background: var(--paper); border-radius: 14px; box-shadow: var(--shlg); display: flex; flex-direction: column; overflow: hidden;">
    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 16px 16px 12px 20px;">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
        <h2 style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600;">{{d.title}}</h2>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink60);">
          <sc-if value="{{d.video}}" hint-placeholder-val="{{ true }}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 10l4.553-2.276A1 1 0 0 1 21 8.618v6.764a1 1 0 0 1-1.447.894L15 14v-4z"></path><path d="M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
          </sc-if>
          <span>{{d.meta}}</span>
        </div>
      </div>
      <button type="button" aria-label="{{s.close}}" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--ink60); display: grid; place-items: center; flex: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
    </div>
    <div style="margin: 0 20px; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--ink05);">
      <img class="{{d.cls}}" src="{{d.src}}" alt="" style="width: 100%; height: 100%; object-fit: contain; display: block;">
    </div>
    <div style="padding: 14px 20px 16px 20px; font-size: 14px; line-height: 22px; color: var(--ink80); white-space: pre-line; max-height: 154px; overflow: hidden;">{{d.prompt}}</div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line);">
      <sc-if value="{{d.mine}}" hint-placeholder-val="{{ false }}">
        <button type="button" aria-label="{{s.delete}}" title="{{s.delete}}" style="width: 32px; height: 32px; border: 0; border-radius: 999px; background: transparent; color: var(--danger); display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"></path></svg></button>
      </sc-if>
      <sc-if value="{{d.public}}" hint-placeholder-val="{{ true }}">
        <a href="#" style="font-size: 12px; color: var(--ink60); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path><path d="M11 13l9-9"></path><path d="M15 4h5v5"></path></svg>{{s.source}}</a>
      </sc-if>
      <span style="flex: 1;"></span>
      <sc-if value="{{d.mine}}" hint-placeholder-val="{{ false }}">
        <button type="button" aria-label="{{s.edit}}" title="{{s.edit}}" style="width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink80); display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L18.5 9.5a2.828 2.828 0 1 0-4-4L4 16v4"></path><path d="M13.5 6.5l4 4"></path></svg></button>
      </sc-if>
      <button type="button" aria-label="{{s.copy}}" title="{{s.copy}}" style="width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink80); display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9.667A2.667 2.667 0 0 1 9.667 7h8.666A2.667 2.667 0 0 1 21 9.667v8.666A2.667 2.667 0 0 1 18.333 21H9.667A2.667 2.667 0 0 1 7 18.333z"></path><path d="M4.012 16.737A2 2 0 0 1 3 15V5c0-1.1.9-2 2-2h10c.75 0 1.158.385 1.5 1"></path></svg></button>
      <button type="button" style="height: 32px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 13px; font-weight: 600;">{{s.primary}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"lang":{"editor":"enum","options":["zh","en"],"default":"zh"},"item":{"editor":"enum","options":["effect","mine"],"default":"effect"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const lang = this.props.lang ?? 'zh';
    const item = this.props.item ?? 'effect';
    const en = lang === 'en';
    const T = (zh, e) => (en ? e : zh);
    const s = {
      close: T('关闭', 'Close'), delete: T('删除', 'Delete'), edit: T('编辑', 'Edit'), copy: T('复制提示词', 'Copy prompt'),
      source: T('来源', 'Source'), primary: T('放上画布', 'Add to canvas'),
    };
    const d = item === 'mine'
      ? {
        title: 'Q 版角色卡', meta: T('我的 · 网页提取 · 图片', 'Mine · Web extract · Image'), video: false, mine: true, public: false,
        src: '/_blob/0d176b83323e4a2718e6ac758aabbf78', cls: 'photo',
        prompt: '画一张带有圆角和柔和投影的现代 UI 卡片 2:3 图片。卡片中央应展示一个上穿图片转换为的 3D 卡通风角色。姿势和服饰应该都是图片的 Q 版版本，在角色下方，包含一个加粗的黑色标题（“Reyna”）和一个字体更小、颜色更浅的副标题（“Valorant”）。使用干净、简约的白色或浅灰色背景。',
      }
      : {
        title: T('推轨跟拍', 'Dolly follow'), meta: T('运镜 · 内置 · 视频', 'Camera · Built-in · Video'), video: true, mine: false, public: true,
        src: '/_blob/762a165fdfb5c15f7fba7e902a2612d5', cls: 'illus',
        prompt: 'Smooth dolly tracking behind the walking subject, steady, matching pace\n\nKeep the walking subject’s identity, appearance, clothing, setting, lighting, color, and continuity unchanged. Change only the tracking path and matching pace described here.',
      };
    return { themeClass: theme === 'dark' ? 'dark' : '', theme, lang, s, d };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>指向元素对齐 · 修后</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.nm{--shell:#f6f5f3;--canvas:#faf9f7;--paper:oklch(1 0 0);--ink:oklch(0.22 0.01 80);--ink80:oklch(0.32 0.01 80);--ink60:oklch(0.50 0.01 80);--ink40:oklch(0.62 0.01 80);--ink30:oklch(0.78 0.01 80);--ink05:oklch(0.97 0.003 80);--line:oklch(0.91 0.004 80);--linesoft:oklch(0.95 0.003 80);--shmd:0 2px 4px oklch(0 0 0 / 0.04),0 8px 24px oklch(0 0 0 / 0.06);font-family:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.nm .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm button{font-family:inherit}
</style>
</helmet>
<div class="nm" style="width: 1440px; height: 900px; background: var(--canvas); position: relative; overflow: hidden; display: flex; gap: 48px; align-items: flex-start; justify-content: center; padding-top: 80px; box-sizing: border-box;">
  <aside aria-label="Agent 斜杠菜单" style="width: 340px; background: var(--paper); border-radius: 10px; box-shadow: 0 0 0 1px var(--line), var(--shmd); overflow: hidden;">
    <div style="padding: 10px 10px 6px 10px;"><div style="height: 30px; border: 1px solid var(--line); border-radius: 6px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; color: var(--ink40);">搜索技能和提示词</div></div>
    <div style="display: flex; gap: 4px; padding: 0 10px 8px 10px;">
      <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 11px; display: inline-flex; align-items: center;">全部</span>
      <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: var(--ink05); color: var(--ink60); font-size: 11px; display: inline-flex; align-items: center;">技能</span>
      <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: var(--ink05); color: var(--ink60); font-size: 11px; display: inline-flex; align-items: center;">提示词</span>
    </div>
    <div style="padding: 0 0 6px 0;">
      <div style="padding: 6px 10px 4px 10px; font-size: 11px; color: var(--ink40);">技能 · 创作流程</div>
      <sc-for list="{{agentSkills}}" as="r" hint-placeholder-count="2">
        <div style="display: flex; gap: 10px; align-items: center; padding: 6px 10px;">
          <img class="thumb" src="{{r.src}}" alt="" style="width: 56px; height: 35px; border-radius: 6px; object-fit: cover; flex: none;">
          <span style="min-width: 0;"><span class="one" style="display: block; font-size: 12px; font-weight: 500;">{{r.name}}</span><span class="one" style="display: block; font-size: 11px; color: var(--ink60);">{{r.desc}}</span></span>
        </div>
      </sc-for>
      <div style="padding: 6px 10px 4px 10px; font-size: 11px; color: var(--ink40);">提示词 · 运镜</div>
      <sc-for list="{{agentPrompts}}" as="r" hint-placeholder-count="2">
        <div style="display: flex; gap: 10px; align-items: center; padding: 6px 10px;">
          <img src="{{r.src}}" alt="" style="width: 56px; height: 35px; border-radius: 6px; object-fit: cover; flex: none;">
          <span style="min-width: 0;"><span class="one" style="display: block; font-size: 12px; font-weight: 500;">{{r.name}}</span><span class="one" style="display: block; font-size: 11px; color: var(--ink60);">{{r.desc}}</span></span>
        </div>
      </sc-for>
    </div>
    <div style="border-top: 1px solid var(--linesoft); padding: 8px 10px; font-size: 12px; color: var(--ink60);">去 Skill 库</div>
  </aside>
  <div style="width: 360px; display: flex; flex-direction: column; gap: 16px;">
    <div style="background: var(--paper); border-radius: 12px; box-shadow: 0 0 0 1px var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px;">
      <span style="align-self: flex-start; height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 6px 0 8px; border-radius: 6px; background: var(--ink05); font-size: 12px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zM9 5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1zM5 8h4M9 16h4M13.8 4.6l2.2-.5c.6-.1 1.1.2 1.3.7l3.7 13.4c.1.5-.2 1.1-.6 1.2l-2.3.6c-.6.1-1.1-.2-1.3-.7L13 5.8c-.1-.6.2-1.1.8-1.2z"></path></svg>分镜规划
        <button type="button" aria-label="移除" style="width: 18px; height: 18px; border: 0; background: transparent; color: var(--ink40); display: grid; place-items: center; padding: 0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
      </span>
      <span style="font-size: 13px; color: var(--ink40);">继续告诉 Nomi 要改什么…</span>
    </div>
    <div style="background: var(--paper); border-radius: 12px; box-shadow: 0 0 0 1px var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px;">
      <span style="align-self: flex-start; height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 6px 0 8px; border-radius: 6px; background: var(--ink05); font-size: 12px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h1m8-9v1m8 8h1M5.6 5.6l.7.7m12.1-.7l-.7.7M9 16a5 5 0 1 1 6 0 3.5 3.5 0 0 0-1 3 2 2 0 0 1-4 0 3.5 3.5 0 0 0-1-3M9.7 17h4.6"></path></svg>推轨跟拍
        <button type="button" aria-label="移除" style="width: 18px; height: 18px; border: 0; background: transparent; color: var(--ink40); display: grid; place-items: center; padding: 0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
      </span>
      <span style="font-size: 13px; color: var(--ink40);">继续告诉 Nomi 要改什么…</span>
    </div>
  </div>
  <aside aria-label="节点提示词预设" style="width: 340px; background: var(--paper); border-radius: 10px; box-shadow: 0 0 0 1px var(--line), var(--shmd); overflow: hidden;">
    <div style="padding: 10px 10px 6px 10px;"><div style="height: 30px; border: 1px solid var(--line); border-radius: 6px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; color: var(--ink40);">搜索提示词</div></div>
    <div style="display: flex; gap: 4px; padding: 0 10px 8px 10px;">
      <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 11px; display: inline-flex; align-items: center;">全部</span>
      <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: var(--ink05); color: var(--ink60); font-size: 11px; display: inline-flex; align-items: center;">我的</span>
      <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: var(--ink05); color: var(--ink60); font-size: 11px; display: inline-flex; align-items: center;">内置</span>
      <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: var(--ink05); color: var(--ink60); font-size: 11px; display: inline-flex; align-items: center;">公开库</span>
    </div>
    <div style="padding: 0 0 6px 0;">
      <div style="padding: 6px 10px 4px 10px; font-size: 11px; color: var(--ink40);">构图 · 8</div>
      <sc-for list="{{nodeRows}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; gap: 10px; align-items: center; padding: 6px 10px;">
          <img src="{{r.src}}" alt="" style="width: 56px; height: 35px; border-radius: 6px; object-fit: cover; flex: none;">
          <span style="min-width: 0;"><span class="one" style="display: block; font-size: 12px; font-weight: 500;">{{r.name}}</span><span class="one" style="display: block; font-size: 11px; color: var(--ink60);">{{r.desc}}</span></span>
        </div>
      </sc-for>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      agentSkills: [
        { name: '品牌宣传片', desc: '做产品/品牌宣传片：把产品文案、卖点做成一条短宣传视频。', src: '/_blob/cfd27c72f35794e6453a243cb70e8170' },
        { name: '分镜规划', desc: '把短故事拆成有序镜头，整理为可审阅的分镜方案。', src: '/_blob/37d3e2fc1e81b5e205a7488814fdb5c3' },
      ],
      agentPrompts: [
        { name: '推轨跟拍', desc: 'Smooth dolly tracking behind the walking subject…', src: '/_blob/d50df25f03b47fd2028fd4290ec055b6' },
        { name: '过肩对话', desc: 'Long-lens over-the-shoulder, foreground shoulder soft, focus on the far face…', src: '/_blob/ca527711624517d16418d72b017c4150' },
      ],
      nodeRows: [
        { name: '画框构图', desc: 'subject framed through a doorway / window / arch, a natural border around them', src: '/_blob/97caaa935fb2a87fe3349d14e5245dbe' },
        { name: '对角线构图', desc: 'Strong diagonal line through frame (stairs, roofline), subject moving along it', src: '/_blob/9f7f5594f9612ccea43e9862a0db306f' },
        { name: '绝对对称', desc: 'Dead-center symmetrical composition, subject on the central axis, sides mirrored', src: '/_blob/53736207baacaf27536404f77af22bf9' },
      ],
    };
  }
}
</script>
</body>
</html>

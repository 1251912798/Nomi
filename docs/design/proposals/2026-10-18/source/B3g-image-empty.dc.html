<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>B3g 图片生成框 空</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
.light{--nomi-logo-ground:oklch(.22 .01 80);--nomi-bg:oklch(.985 .003 90);--nomi-paper:oklch(1 0 0);--nomi-ink:oklch(.22 .01 80);--nomi-ink80:oklch(.32 .01 80);--nomi-ink60:oklch(.5 .01 80);--nomi-ink10:oklch(.94 .003 80);--nomi-ink05:oklch(.97 .003 80);--nomi-line:oklch(.91 .004 80);--nomi-accent:oklch(.55 .13 250);--nomi-accent-soft:color-mix(in srgb,var(--nomi-accent) 12%,var(--nomi-paper));--nomi-shadow-sm:0 1px 2px oklch(0 0 0/0.04),0 1px 1px oklch(0 0 0/0.03);--nomi-shadow-md:0 2px 4px oklch(0 0 0/0.04),0 8px 24px oklch(0 0 0/0.06);--nomi-shadow-lg:0 4px 8px oklch(0 0 0/0.05),0 20px 50px oklch(0 0 0/0.08)}
.dark{--nomi-logo-ground:oklch(.30 .01 80);--nomi-bg:oklch(.18 .006 80);--nomi-paper:oklch(.235 .007 80);--nomi-ink:oklch(.93 .006 85);--nomi-ink80:oklch(.84 .006 85);--nomi-ink60:oklch(.7 .006 85);--nomi-ink10:oklch(.34 .006 85);--nomi-ink05:oklch(.3 .006 85);--nomi-line:oklch(.36 .007 80);--nomi-accent:oklch(.7 .13 250);--nomi-accent-soft:color-mix(in srgb,var(--nomi-accent) 26%,var(--nomi-paper));--nomi-shadow-sm:0 1px 2px oklch(0 0 0/0.32),0 1px 1px oklch(0 0 0/0.22);--nomi-shadow-md:0 2px 5px oklch(0 0 0/0.30),0 14px 34px oklch(0 0 0/0.32);--nomi-shadow-lg:0 4px 10px oklch(0 0 0/0.30),0 24px 64px oklch(0 0 0/0.40)}
.pane{--nomi-radius-sm:6px;--nomi-radius:10px;box-sizing:border-box;width:600px;height:500px;padding:24px 20px;background-color:var(--nomi-bg);background-image:radial-gradient(var(--nomi-ink10) 1px,transparent 1px);background-size:18px 18px;color:var(--nomi-ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:13px;line-height:1.5}
.node{position:relative;box-sizing:border-box;width:560px;padding:12px;background:var(--nomi-paper);border:1px solid var(--nomi-line);border-radius:var(--nomi-radius);box-shadow:var(--nomi-shadow-md)}
.refs{display:flex;align-items:flex-start;gap:8px;min-height:40px}
.tb{flex:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border:0;border-radius:var(--nomi-radius-sm);background:var(--nomi-ink05);color:var(--nomi-ink80)}
.tb:hover{background:var(--nomi-ink10)}
.ib{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:1px solid var(--nomi-line);border-radius:999px;background:var(--nomi-paper);color:var(--nomi-ink80)}
.ib.bare{border-color:transparent}
.vsep{flex:none;width:1px;height:20px;background:var(--nomi-line)}
.prompt{position:relative;padding:8px 36px 8px 4px;min-height:72px;font-size:14px;line-height:1.6}
.prompt .ph{color:var(--nomi-ink60)}
.prompt .ib{position:absolute;right:0;top:4px}
.bar{display:flex;flex-wrap:nowrap;align-items:center;gap:4px;padding-top:4px}
.bar .sp{flex:1;min-width:0}
.chip{flex:none;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border:1px solid var(--nomi-line);border-radius:999px;background:var(--nomi-paper);color:var(--nomi-ink80);font:inherit;font-size:12px;white-space:nowrap}
.chip.open{background:var(--nomi-accent-soft);color:var(--nomi-ink)}
.send{flex:none;width:30px;height:30px;padding:0;border:0;border-radius:999px;background:var(--nomi-ink);color:var(--nomi-paper);display:flex;align-items:center;justify-content:center}
.pop{position:absolute;z-index:3;left:112px;bottom:50px;box-sizing:border-box;width:max-content;display:grid;grid-template-columns:max-content max-content;column-gap:8px;row-gap:8px;align-items:center;padding:12px;background:var(--nomi-paper);border:1px solid var(--nomi-line);border-radius:var(--nomi-radius);box-shadow:var(--nomi-shadow-lg)}
.gl{font-size:12px;color:var(--nomi-ink60);margin:0;white-space:nowrap}
.gl.first{margin-top:0}
.seg{display:inline-flex;padding:2px;background:var(--nomi-ink05);border-radius:999px}
.seg button{flex:none;min-width:32px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;height:28px;border:0;border-radius:999px;background:transparent;color:var(--nomi-ink60);font:inherit;font-size:12px}
.seg button.on{background:var(--nomi-paper);color:var(--nomi-ink);font-weight:600;box-shadow:var(--nomi-shadow-sm)}

.light{--nomi-ink40:oklch(.68 .01 80)}
.dark{--nomi-ink40:oklch(.62 .006 85)}
.rp{position:absolute;z-index:5;box-sizing:border-box;width:320px;border:1px solid var(--nomi-line);background:var(--nomi-paper);border-radius:16px;box-shadow:var(--nomi-shadow-md)}
.rp .rpi{display:flex;flex-direction:column;gap:12px;padding:12px;max-height:420px;overflow-y:auto;border-radius:16px}
.rp .rg{display:flex;flex-direction:column;gap:6px}
.rp .rt{font-size:11px;font-weight:600;line-height:1;color:var(--nomi-ink40)}
.rp .sgm{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:4px;padding:4px;border-radius:10px;background:var(--nomi-ink05)}
.rp .sgm button{min-height:28px;padding:4px 8px;border:0;border-radius:6px;background:transparent;color:var(--nomi-ink60);font:inherit;font-size:12px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0}
.rp .sgm button.on{background:var(--nomi-paper);color:var(--nomi-ink);font-weight:600;box-shadow:var(--nomi-shadow-sm)}
.rp .sgm button.dis{color:var(--nomi-ink40);opacity:.6}
.rp .shp{display:block;height:18px}
.rp .sl{display:flex;align-items:center;gap:12px;min-width:0}
.rp .sl .tr{position:relative;flex:1;min-width:0;height:6px;border-radius:3px;background:var(--nomi-ink10)}
.rp .sl .tr i{position:absolute;left:0;top:0;height:6px;border-radius:3px;background:var(--nomi-accent)}
.rp .sl .tr u{position:absolute;top:-5px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--nomi-paper);border:2px solid var(--nomi-accent);box-sizing:border-box;text-decoration:none}
.rp .sl b{flex:none;min-width:28px;text-align:right;font-size:12px;font-weight:400;color:var(--nomi-ink80);font-variant-numeric:tabular-nums}
.rp .swr{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px}
.rp .sw{position:relative;flex:none;width:28px;height:16px;border-radius:8px;background:var(--nomi-ink10)}
.rp .sw.on{background:var(--nomi-accent)}
.rp .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--nomi-paper)}
.rp .sw.on::after{left:14px}
.chip.sum{background:var(--nomi-ink05);padding:0 8px 0 10px}
</style>
</helmet>
<div style="display:flex;width:1200px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="pane {{t.cls}}">
  <div style="font-size:12px;color:var(--nomi-ink60);margin:0 0 6px 4px">图片生成框　<span>参数面板 = 现有组件原样</span></div>
  <div style="height:200px"></div>
  <div class="node">
    <div class="refs">
      <button class="tb" aria-label="画布点选"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.904 17.563a1.2 1.2 0 0 0 2.228 .308l2.09 -3.093l4.907 4.907a1.067 1.067 0 0 0 1.509 0l1.047 -1.047a1.067 1.067 0 0 0 0 -1.509l-4.907 -4.907l3.113 -2.09a1.2 1.2 0 0 0 -.309 -2.228l-13.582 -3.904l3.904 13.563"/></svg></button>
      <button class="tb" aria-label="添加参考：上传或从素材库选"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5l0 14"/><path d="M5 12l14 0"/></svg></button>
    </div>
    <div class="prompt"><span class="ph">写下想要的画面；加了参考图，就按参考 / 改图来生成</span>
      <button class="ib bare" aria-label="展开提示词"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4l4 0l0 4"/><path d="M14 10l6 -6"/><path d="M8 20l-4 0l0 -4"/><path d="M4 20l6 -6"/></svg></button>
    </div>
    <div class="bar">
      <button class="chip">GPT Image 2<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6l6 -6"/></svg></button>
      <button class="chip sum" aria-expanded="true">1:1 · 2K · 中<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6l6 -6"/></svg></button>
      <span class="sp"></span>
      <button class="ib bare" aria-label="提示词预设"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2"/><path d="M9 9l1 0"/><path d="M9 13l6 0"/><path d="M9 17l6 0"/></svg></button>
      <button class="ib bare" aria-label="翻译提示词（中英互译，选中一段只翻那段）"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6.371c0 4.418 -2.239 6.629 -5 6.629"/><path d="M4 6.371h7"/><path d="M5 9c0 2.144 2.252 3.908 6 4"/><path d="M12 20l4 -9l4 9"/><path d="M19.1 18h-6.2"/><path d="M6.694 3l.793 .582"/></svg></button>
      <button class="ib bare" aria-label="用 Nomi 优化提示词"><svg width="14" height="14" viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect width="28" height="28" rx="7" fill="var(--nomi-logo-ground)"/><rect x="5.5" y="5.5" width="4" height="17" rx="1.2" fill="white"/><rect x="18.5" y="5.5" width="4" height="17" rx="1.2" fill="white"/><polygon points="9.5,5.5 13.5,5.5 18.5,22.5 14.5,22.5" fill="white"/></svg></button>
      <span class="vsep"></span>
      <button class="chip">1 张<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6l6 -6"/></svg></button>
      <button class="send" aria-label="生成"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5l0 14"/><path d="M18 11l-6 -6"/><path d="M6 11l6 -6"/></svg></button>
    </div>
    <div class="rp" style="left:8px;bottom:46px" role="group" aria-label="生成参数面板"><div class="rpi"><div class="rg"><div class="rt">比例</div><div class="sgm" role="radiogroup"><button type="button" class="on"><svg class="shp" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3.0" y="3.0" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>1:1</span></button><button type="button" class=""><svg class="shp" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="1.0" y="4.5" width="16" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>16:9</span></button><button type="button" class=""><svg class="shp" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="4.5" y="1.0" width="9" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>9:16</span></button><button type="button" class=""><svg class="shp" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2.0" y="3.75" width="14" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>4:3</span></button><button type="button" class=""><svg class="shp" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3.75" y="2.0" width="10.5" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>3:4</span></button></div></div><div class="rg"><div class="rt">清晰度</div><div class="sgm" role="radiogroup"><button type="button" class=""><span>1K</span></button><button type="button" class="on"><span>2K</span></button><button type="button" class=""><span>4K</span></button></div></div><div class="rg"><div class="rt">画质</div><div class="sgm" role="radiogroup"><button type="button" class=""><span>低</span></button><button type="button" class="on"><span>中</span></button><button type="button" class=""><span>高</span></button></div></div></div></div>
  </div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":500}}'>
class Component extends DCLogic {
  renderVals() { return { themes: [{ cls: 'light' }, { cls: 'dark' }] }; }
}
</script>
</body>
</html>

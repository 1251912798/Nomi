<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
.light{--nomi-logo-ground:oklch(.22 .01 80);--nomi-bg:oklch(.985 .003 90);--nomi-paper:oklch(1 0 0);--nomi-ink:oklch(.22 .01 80);--nomi-ink80:oklch(.32 .01 80);--nomi-ink60:oklch(.5 .01 80);--nomi-ink10:oklch(.94 .003 80);--nomi-ink05:oklch(.97 .003 80);--nomi-line:oklch(.91 .004 80);--nomi-accent:oklch(.55 .13 250);--nomi-accent-soft:color-mix(in srgb,var(--nomi-accent) 12%,var(--nomi-paper));--nomi-shadow-sm:0 1px 2px oklch(0 0 0/0.04),0 1px 1px oklch(0 0 0/0.03);--nomi-shadow-md:0 2px 4px oklch(0 0 0/0.04),0 8px 24px oklch(0 0 0/0.06);--nomi-shadow-lg:0 4px 8px oklch(0 0 0/0.05),0 20px 50px oklch(0 0 0/0.08)}
.dark{--nomi-logo-ground:oklch(.30 .01 80);--nomi-bg:oklch(.18 .006 80);--nomi-paper:oklch(.235 .007 80);--nomi-ink:oklch(.93 .006 85);--nomi-ink80:oklch(.84 .006 85);--nomi-ink60:oklch(.7 .006 85);--nomi-ink10:oklch(.34 .006 85);--nomi-ink05:oklch(.3 .006 85);--nomi-line:oklch(.36 .007 80);--nomi-accent:oklch(.7 .13 250);--nomi-accent-soft:color-mix(in srgb,var(--nomi-accent) 26%,var(--nomi-paper));--nomi-shadow-sm:0 1px 2px oklch(0 0 0/0.32),0 1px 1px oklch(0 0 0/0.22);--nomi-shadow-md:0 2px 5px oklch(0 0 0/0.30),0 14px 34px oklch(0 0 0/0.32);--nomi-shadow-lg:0 4px 10px oklch(0 0 0/0.30),0 24px 64px oklch(0 0 0/0.40)}
.pane{--nomi-radius-sm:6px;--nomi-radius:10px;box-sizing:border-box;width:600px;height:560px;padding:24px 20px;background-color:var(--nomi-bg);background-image:radial-gradient(var(--nomi-ink10) 1px,transparent 1px);background-size:18px 18px;color:var(--nomi-ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:13px;line-height:1.5}
.node{position:relative;box-sizing:border-box;width:560px;padding:12px;background:var(--nomi-paper);border:1px solid var(--nomi-line);border-radius:var(--nomi-radius);box-shadow:var(--nomi-shadow-md)}
.refs{display:flex;align-items:flex-start;gap:8px;min-height:40px}
.tb{flex:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border:0;border-radius:var(--nomi-radius-sm);background:var(--nomi-ink05);color:var(--nomi-ink80)}
.tb:hover{background:var(--nomi-ink10)}
.ib{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:1px solid var(--nomi-line);border-radius:999px;background:var(--nomi-paper);color:var(--nomi-ink80)}
.ib.bare{border-color:transparent}
.vsep{flex:none;width:1px;height:20px;background:var(--nomi-line)}
.prompt{position:relative;padding:8px 36px 8px 4px;min-height:72px;font-size:14px;line-height:1.6}
.prompt .ph{color:var(--nomi-ink60)}
.prompt .ib{position:absolute;right:0;top:4px}
.bar{display:flex;flex-wrap:nowrap;align-items:center;gap:4px;padding-top:4px}
.bar .sp{flex:1;min-width:0}
.chip{flex:none;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border:1px solid var(--nomi-line);border-radius:999px;background:var(--nomi-paper);color:var(--nomi-ink80);font:inherit;font-size:12px;white-space:nowrap}
.chip.open{background:var(--nomi-accent-soft);color:var(--nomi-ink)}
.send{flex:none;width:30px;height:30px;padding:0;border:0;border-radius:999px;background:var(--nomi-ink);color:var(--nomi-paper);display:flex;align-items:center;justify-content:center}
.pop{position:absolute;z-index:3;left:150px;bottom:50px;box-sizing:border-box;width:max-content;display:grid;grid-template-columns:max-content max-content;column-gap:8px;row-gap:8px;align-items:center;padding:12px;background:var(--nomi-paper);border:1px solid var(--nomi-line);border-radius:var(--nomi-radius);box-shadow:var(--nomi-shadow-lg)}
.gl{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--nomi-ink60);margin:0;white-space:nowrap}
.gl.first{margin-top:0}
.seg{display:inline-flex;padding:2px;background:var(--nomi-ink05);border-radius:999px}
.seg button{flex:none;min-width:32px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:4px;height:28px;border:0;border-radius:999px;background:transparent;color:var(--nomi-ink60);font:inherit;font-size:12px}
.seg button.on{background:var(--nomi-paper);color:var(--nomi-ink);font-weight:600;box-shadow:var(--nomi-shadow-sm)}
.tip{position:absolute;z-index:4;left:80px;top:-36px;padding:6px 10px;background:var(--nomi-ink);color:var(--nomi-paper);border-radius:var(--nomi-radius-sm);font-size:12px;line-height:1.4;white-space:nowrap}

.light{--nomi-ink40:oklch(.68 .01 80)}
.dark{--nomi-ink40:oklch(.62 .006 85)}
.rp{position:absolute;z-index:5;box-sizing:border-box;width:320px;border:1px solid var(--nomi-line);background:var(--nomi-paper);border-radius:16px;box-shadow:var(--nomi-shadow-md)}
.rp .rpi{display:flex;flex-direction:column;gap:12px;padding:12px;max-height:420px;overflow-y:auto;border-radius:16px}
.rp .rg{display:flex;flex-direction:column;gap:6px}
.rp .rt{font-size:11px;font-weight:600;line-height:1;color:var(--nomi-ink40)}
.rp .sgm{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:4px;padding:4px;border-radius:10px;background:var(--nomi-ink05)}
.rp .sgm button{min-height:28px;padding:4px 8px;border:0;border-radius:6px;background:transparent;color:var(--nomi-ink60);font:inherit;font-size:12px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0}
.rp .sgm button.on{background:var(--nomi-paper);color:var(--nomi-ink);font-weight:600;box-shadow:var(--nomi-shadow-sm)}
.rp .sgm button.dis{color:var(--nomi-ink40);opacity:.6}
.rp .shp{display:block;height:18px}
.rp .sl{display:flex;align-items:center;gap:12px;min-width:0}
.rp .sl .tr{position:relative;flex:1;min-width:0;height:6px;border-radius:3px;background:var(--nomi-ink10)}
.rp .sl .tr i{position:absolute;left:0;top:0;height:6px;border-radius:3px;background:var(--nomi-accent)}
.rp .sl .tr u{position:absolute;top:-5px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--nomi-paper);border:2px solid var(--nomi-accent);box-sizing:border-box;text-decoration:none}
.rp .sl b{flex:none;min-width:28px;text-align:right;font-size:12px;font-weight:400;color:var(--nomi-ink80);font-variant-numeric:tabular-nums}
.rp .swr{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px}
.rp .sw{position:relative;flex:none;width:28px;height:16px;border-radius:8px;background:var(--nomi-ink10)}
.rp .sw.on{background:var(--nomi-accent)}
.rp .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--nomi-paper)}
.rp .sw.on::after{left:14px}
.chip.sum{background:var(--nomi-ink05);padding:0 8px 0 10px}

.oldpop{position:absolute;left:100px;bottom:46px;z-index:3;box-sizing:border-box;width:max-content;display:grid;grid-template-columns:max-content max-content;column-gap:8px;row-gap:8px;align-items:center;padding:12px;background:var(--nomi-paper);border:1px solid var(--nomi-line);border-radius:10px;box-shadow:var(--nomi-shadow-lg)}
.oldpop .gl{font-size:12px;color:var(--nomi-ink60);white-space:nowrap}
.oseg{display:inline-flex;padding:2px;background:var(--nomi-ink05);border-radius:999px}
.oseg button{flex:none;min-width:32px;padding:0 8px;height:28px;border:0;border-radius:999px;background:transparent;color:var(--nomi-ink60);font:inherit;font-size:12px}
.oseg button.on{background:var(--nomi-paper);color:var(--nomi-ink);font-weight:600;box-shadow:var(--nomi-shadow-sm)}
.nodew{position:relative;box-sizing:border-box;width:520px;height:180px;margin-top:460px}
.cmpcap{font-size:12px;color:var(--nomi-ink60);margin:0 0 6px 4px}

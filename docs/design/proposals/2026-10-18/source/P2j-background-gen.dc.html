.bd.dark{--bg:oklch(0.18 0.006 80);--paper:oklch(0.235 0.007 80);--chrome:oklch(0.155 0.006 80);--ink:oklch(0.93 0.006 85);--ink80:oklch(0.84 0.006 85);--ink60:oklch(0.70 0.006 85);--ink40:oklch(0.62 0.006 85);--ink30:oklch(0.50 0.006 85);--ink20:oklch(0.42 0.006 85);--ink10:oklch(0.34 0.006 85);--ink05:oklch(0.30 0.006 85);--line:oklch(0.36 0.007 80);--lineSoft:oklch(0.31 0.007 80);--accent:oklch(0.70 0.13 250);--accentSoft:color-mix(in srgb, oklch(0.70 0.13 250) 26%, oklch(0.235 0.007 80));--infoInk:oklch(0.82 0.13 250);--infoSoft:oklch(0.295 0.045 250);--warnInk:oklch(0.82 0.085 72);--warnSoft:oklch(0.295 0.04 72);--warnEdge:oklch(0.395 0.058 72);--okInk:oklch(0.82 0.09 145);--okSoft:oklch(0.295 0.042 145);--danger:oklch(0.72 0.16 25);--dangerSoft:oklch(0.3 0.048 25);--logo:oklch(0.30 0.01 80);--dot:oklch(0.27 0.006 85);--scrim:oklch(0.1 0.01 80 / 0.6);--shSm:0 1px 2px oklch(0 0 0 / 0.32),0 1px 1px oklch(0 0 0 / 0.22);--shMd:0 2px 5px oklch(0 0 0 / 0.30),0 14px 34px oklch(0 0 0 / 0.32);--shLg:0 4px 10px oklch(0 0 0 / 0.30),0 24px 64px oklch(0 0 0 / 0.40)}

.i12{width:12px;height:12px}.i14{width:14px;height:14px}.i16{width:16px;height:16px}.i18{width:18px;height:18px}.i20{width:20px;height:20px}

.shell{position:relative;width:1280px;height:800px;overflow:hidden;background:var(--chrome);border-radius:10px;box-shadow:0 0 0 1px var(--line)}

.proj{display:flex;align-items:center;gap:4px;height:28px;padding:0 6px 0 8px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink)}

.ib{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink60);position:relative;flex:none}

.tasks{display:flex;align-items:center;gap:4px;height:28px;padding:0 6px;border-radius:6px;color:var(--ink60)}
.dotmark{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--chrome)}
.wc{display:flex;margin-left:6px}

.ri{width:48px;height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink60)}
.ri.on{background:var(--accentSoft);color:var(--ink)}
.ri span{font-size:11px;line-height:13px;max-width:46px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rdiv{width:24px;height:1px;background:var(--line);margin:8px 0}
.rail .grow{flex:1}
.work{position:absolute;left:60px;top:40px;right:8px;bottom:8px;border-radius:10px;background:var(--bg);box-shadow:0 0 0 1px var(--lineSoft);overflow:hidden}
.surf{position:relative;border-radius:10px;background:var(--bg);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.dots{background-image:radial-gradient(var(--dot) 1px, transparent 1.2px);background-size:16px 16px;background-position:-4px -4px}
.abs{position:absolute}
.grp{position:absolute;border-radius:16px;background:color-mix(in srgb, var(--ink05) 70%, transparent);box-shadow:inset 0 0 0 1px var(--lineSoft)}
.grp-h{position:absolute;left:16px;top:10px;right:12px;height:26px;display:flex;align-items:center;gap:8px}
.grp-t{font-size:12px;font-weight:500;color:var(--ink80)}
.grp-m{font-size:12px;color:var(--ink40)}
.pillbtn{height:28px;padding:0 12px;border-radius:999px;background:var(--paper);box-shadow:0 0 0 1px var(--line);font-size:12px;font-weight:500;color:var(--ink80);display:flex;align-items:center;gap:6px}
.lab{position:absolute;display:flex;align-items:center;gap:6px;height:20px}
.shot{height:20px;padding:0 6px;border-radius:6px;background:var(--paper);box-shadow:0 0 0 1px var(--line);font-size:12px;font-weight:600;color:var(--ink80);display:flex;align-items:center}
.ntl{font-size:12px;color:var(--ink60)}
.nd{position:absolute;width:300px;height:169px;border-radius:10px;overflow:hidden;box-shadow:var(--shSm),0 0 0 1px oklch(0 0 0 / 0.04)}
.nd.sel{box-shadow:0 0 0 1.5px var(--accent),var(--shMd)}

.m2{background:radial-gradient(circle at 70% 30%,rgba(255,236,214,.28) 0 17px,transparent 18px),radial-gradient(130% 70% at 30% 112%,rgba(14,8,6,.55) 0 55%,transparent 56%),linear-gradient(165deg,#6a4a40 0%,#2a1d1a 72%)}
.m3{background:radial-gradient(circle at 70% 30%,rgba(236,226,255,.26) 0 17px,transparent 18px),radial-gradient(130% 70% at 30% 112%,rgba(10,8,16,.55) 0 55%,transparent 56%),linear-gradient(165deg,#5a4c6a 0%,#1d1826 72%)}
.m4{background:radial-gradient(circle at 68% 32%,rgba(255,225,200,.24) 0 17px,transparent 18px),radial-gradient(130% 70% at 30% 112%,rgba(6,12,16,.55) 0 55%,transparent 56%),linear-gradient(165deg,#41576a 0%,#141d26 72%)}

.m6{background:radial-gradient(circle at 70% 30%,rgba(222,236,248,.26) 0 17px,transparent 18px),radial-gradient(130% 70% at 30% 112%,rgba(6,10,14,.55) 0 55%,transparent 56%),linear-gradient(165deg,#4a5a6a 0%,#161d24 72%)}
.p1{background:radial-gradient(42% 60% at 50% 46%,#d9b9a3 0 38%,transparent 39%),radial-gradient(60% 60% at 50% 110%,#2c3442 0 60%,transparent 61%),linear-gradient(180deg,#e9e4dc,#cfc6ba)}
.p2{background:radial-gradient(40% 52% at 50% 44%,#c9a58c 0 38%,transparent 39%),radial-gradient(60% 60% at 50% 110%,#4a3a30 0 60%,transparent 61%),linear-gradient(180deg,#dcd3c6,#bfb3a2)}

.empty{position:absolute;width:300px;height:169px;border-radius:10px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}

.catrow>*{pointer-events:auto}
.cats{display:flex;align-items:center;height:36px;padding:3px;gap:2px;border-radius:999px;background:var(--paper);box-shadow:var(--shMd),0 0 0 1px var(--lineSoft);min-width:0;flex:0 1 auto}

.ct{flex:none;position:relative;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--ink60);white-space:nowrap}

.ctail{flex:none;font-size:12px;color:var(--ink60);white-space:nowrap}

.psec{padding:8px 12px 4px;font-size:12px;color:var(--ink40)}

.pr .pc{margin-left:auto;font-size:12px;color:var(--ink40);font-variant-numeric:tabular-nums;flex:none}

.pr.cur{color:var(--ink);font-weight:500}
.pr.hov{background:var(--ink05)}

.pr .tk{flex:none;width:16px;color:var(--accent)}

.pft{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-top:1px solid var(--lineSoft);font-size:13px;color:var(--ink80)}

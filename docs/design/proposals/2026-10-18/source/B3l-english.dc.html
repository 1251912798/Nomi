<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
.light{--nomi-logo-ground:oklch(.22 .01 80);--nomi-bg:oklch(.985 .003 90);--nomi-paper:oklch(1 0 0);--nomi-ink:oklch(.22 .01 80);--nomi-ink80:oklch(.32 .01 80);--nomi-ink60:oklch(.5 .01 80);--nomi-ink10:oklch(.94 .003 80);--nomi-ink05:oklch(.97 .003 80);--nomi-line:oklch(.91 .004 80);--nomi-accent:oklch(.55 .13 250);--nomi-accent-soft:color-mix(in srgb,var(--nomi-accent) 12%,var(--nomi-paper));--nomi-shadow-sm:0 1px 2px oklch(0 0 0/0.04),0 1px 1px oklch(0 0 0/0.03);--nomi-shadow-md:0 2px 4px oklch(0 0 0/0.04),0 8px 24px oklch(0 0 0/0.06);--nomi-shadow-lg:0 4px 8px oklch(0 0 0/0.05),0 20px 50px oklch(0 0 0/0.08)}
.pane{--nomi-radius-sm:6px;--nomi-radius:10px;box-sizing:border-box;width:600px;height:380px;padding:24px 20px;background-color:var(--nomi-bg);background-image:radial-gradient(var(--nomi-ink10) 1px,transparent 1px);background-size:18px 18px;color:var(--nomi-ink);font-family:Inter,system-ui,sans-serif;font-size:13px;line-height:1.5}
.cap{font-size:12px;color:var(--nomi-ink60);margin:0 0 34px 4px}
.node{position:relative;box-sizing:border-box;width:560px;padding:12px;background:var(--nomi-paper);border:1px solid var(--nomi-line);border-radius:var(--nomi-radius);box-shadow:var(--nomi-shadow-md)}
.refs{display:flex;align-items:flex-start;gap:8px;min-height:40px}
.tb{flex:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border:0;border-radius:var(--nomi-radius-sm);background:var(--nomi-ink05);color:var(--nomi-ink80)}
.ib{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:1px solid var(--nomi-line);border-radius:999px;background:var(--nomi-paper);color:var(--nomi-ink80)}
.ib.bare{border-color:transparent}
.vsep{flex:none;width:1px;height:20px;background:var(--nomi-line)}
.cell{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:40px;margin-left:12px}
.cell+.sw+.cell{margin-left:0}
.cell .lb{font-size:12px;color:var(--nomi-ink60);white-space:nowrap}
.t{position:relative;flex:none;width:40px;height:40px}
.t svg.img{display:block;border-radius:var(--nomi-radius-sm)}
.t.empty{display:flex;align-items:center;justify-content:center;padding:0;border:0;background:var(--nomi-ink05);color:var(--nomi-ink60);border-radius:var(--nomi-radius-sm)}
.t .x{display:none}
.t.hover .x{display:flex}
.x{position:absolute;right:-10px;top:-10px;width:28px;height:28px;padding:0;border:0;background:transparent;align-items:center;justify-content:center}
.x i{display:flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:999px;background:var(--nomi-ink);color:var(--nomi-paper)}
.sw{margin-top:6px}
.cnt{margin-left:auto;align-self:center;font-size:12px;color:var(--nomi-ink60);white-space:nowrap}
.prompt{position:relative;padding:8px 36px 8px 4px;min-height:72px;font-size:14px;line-height:1.9}
.prompt .ib{position:absolute;right:0;top:4px}
.m{display:inline-flex;align-items:center;gap:4px;padding:0 8px 0 3px;border-radius:999px;background:var(--nomi-accent-soft);color:var(--nomi-ink);font-weight:500;line-height:1.5;vertical-align:baseline}
.m svg{display:block;border-radius:4px}
.tc{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tcc{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:999px;background:var(--nomi-ink05);color:var(--nomi-ink80);font-size:12px}
.bar{display:flex;flex-wrap:nowrap;align-items:center;gap:4px;padding-top:4px}
.bar .sp{flex:1;min-width:0}
.chip{flex:none;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border:1px solid var(--nomi-line);border-radius:999px;background:var(--nomi-paper);color:var(--nomi-ink80);font:inherit;font-size:12px;white-space:nowrap}
.send{flex:none;width:30px;height:30px;padding:0;border:0;border-radius:999px;background:var(--nomi-ink);color:var(--nomi-paper);display:flex;align-items:center;justify-content:center}
.tip{position:absolute;z-index:4;left:-4px;top:-36px;padding:6px 10px;background:var(--nomi-ink);color:var(--nomi-paper);border-radius:var(--nomi-radius-sm);font-size:12px;line-height:1.4;white-space:nowrap}
</style>
</helmet>
